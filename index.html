<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Курсив Маркет — Клиент</title>
<style>
:root{--bg:#0b1020;--card:#141b33;--card2:#1b2444;--text:#e8ecff;--muted:#8b95c2;
  --accent:#5b7cff;--accent2:#7c5bff;--ok:#25d18a;--err:#ff5b6e;--warn:#ffc107;
  --blue:#5b9cff;--orange:#ff8a00;--border:#26305a;--star:#ffc107}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(1200px 800px at 20% -10%, #1a2350, #0b1020 60%);
  color:var(--text);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.logo-sm{font-weight:700;letter-spacing:.3px}
.logo-sm span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:rgba(11,16,32,.9);backdrop-filter:blur(10px);z-index:10}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--border);
  color:var(--muted);white-space:nowrap;cursor:pointer;font-size:14px;font-family:inherit;position:relative}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.content{padding:16px;flex:1;padding-bottom:40px}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);
  background:#0f1530;color:var(--text);font-size:15px;margin-bottom:10px;font-family:inherit;outline:none}
.input:focus{border-color:var(--accent)}
textarea.input{resize:vertical;min-height:70px;font-family:inherit}
.pin{letter-spacing:14px;text-align:center;font-size:24px}
.code-input{letter-spacing:8px;text-align:center;font-size:22px;font-family:monospace}
.btn{width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;font-size:15px;font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:inherit;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn.small{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.btn.ok{background:var(--ok)} .btn.err{background:var(--err)}
.btn.warn{background:var(--warn); color: #000}
.btn:disabled{opacity:.5;cursor:wait}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.panel{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px}
.brand{text-align:center;margin-bottom:20px}
.logo{width:56px;height:56px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-bottom:10px}
.err{color:var(--err);font-size:13px;min-height:18px;margin-bottom:8px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.prod{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;
  display:flex;flex-direction:column;gap:8px;transition:transform .15s;cursor:pointer}
.prod:hover{transform:translateY(-2px);border-color:var(--accent)}
.prod-img{font-size:56px;text-align:center;padding:14px 0;background:#0f1530;border-radius:12px;
  display:flex;align-items:center;justify-content:center;min-height:110px;overflow:hidden}
.prod-img img{max-width:100%;max-height:110px;object-fit:cover;border-radius:10px}
.prod-name{font-size:14px;font-weight:600;line-height:1.3}
.prod-brand{font-size:11px;color:var(--muted);font-weight:500;margin-top:-4px}
.prod-price{font-size:16px;font-weight:700;color:#a5b8ff}
.prod-add{padding:9px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:14px;margin-bottom:8px}
.cart-img{width:52px;height:52px;background:#0f1530;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden}
.cart-img img{width:100%;height:100%;object-fit:cover}
.cart-info{flex:1}
.cart-name{font-size:14px;font-weight:600}
.cart-price{color:var(--muted);font-size:13px;margin-top:2px}
.cart-qty{display:flex;align-items:center;gap:6px}
.qty-btn{width:28px;height:28px;border-radius:8px;background:var(--card2);border:1px solid var(--border);
  color:var(--text);cursor:pointer;font-size:14px;font-family:inherit;display:flex;align-items:center;justify-content:center}
.qty-num{min-width:24px;text-align:center;font-weight:600}
.cart-remove{background:transparent;border:none;color:var(--err);font-size:18px;cursor:pointer;padding:4px 8px}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:16px;margin-top:8px;
  background:var(--card2);border-radius:14px;font-size:16px;font-weight:600}
.order{padding:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px; cursor:pointer; transition:.15s}
.order:hover {border-color:var(--accent);}
.order-head{display:flex;justify-content:space-between;margin-bottom:8px;align-items:center}
.badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.transit{background:rgba(91,156,255,.15);color:var(--blue)}
.badge.ready{background:rgba(37,209,138,.15);color:var(--ok)}
.badge.issued{background:rgba(139,149,194,.15);color:var(--muted)}
.badge.returned{background:rgba(255,138,0,.15);color:var(--orange)}
.badge.pending{background:rgba(255,193,7,.15);color:var(--warn)}
.badge.paid{background:rgba(37,209,138,.15);color:var(--ok)}
.badge.unpaid{background:rgba(255,91,110,.15);color:var(--err)}
.badge.courier{background:rgba(124,91,255,.15);color:var(--accent2)}
.badge.sc{background:rgba(255,193,7,.15);color:var(--warn)}
.reason-box{padding:10px;border-radius:10px;background:rgba(255,138,0,.08);border:1px solid rgba(255,138,0,.3);
  margin-top:8px;font-size:13px;color:#ffb366}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-body{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;
  width:100%;max-width:460px;max-height:92vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head b{font-size:17px}
.close-btn{background:transparent;border:1px solid var(--border);color:var(--muted);width:32px;height:32px;
  border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.pvz-option{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card2);
  border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.15s}
.pvz-option:hover{border-color:var(--accent)}
.pvz-option.selected{border-color:var(--accent);background:rgba(91,124,255,.12)}
.pvz-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.pvz-option.selected .pvz-radio{border-color:var(--accent)}
.pvz-option.selected .pvz-radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--accent)}
.pvz-info{flex:1}
.pvz-name{font-weight:600;font-size:14px}
.pvz-city{color:#a5b8ff;font-size:12px;margin-top:2px;font-weight:600}
.pvz-address{color:var(--muted);font-size:12px;margin-top:2px}
.pvz-schedule{color:var(--muted);font-size:12px;margin-top:2px}
.qr-box{background:#fff;padding:14px;border-radius:16px;display:flex;justify-content:center;margin:14px 0}
.code-box{font-size:34px;font-weight:800;letter-spacing:6px;text-align:center;color:#a5b8ff;
  font-family:monospace;padding:16px;background:#0a1024;border-radius:14px;border:1px dashed var(--border);margin-bottom:14px}
.app-row{padding:14px;background:var(--card2);border-radius:14px;margin-bottom:10px}
.app-head{display:flex;justify-content:space-between;margin-bottom:8px;align-items:center}
.app-row .address{font-size:14px;margin-bottom:4px}
.app-row .schedule{color:var(--muted);font-size:13px;margin-bottom:4px}
.app-row .contact{color:var(--muted);font-size:12px;margin-bottom:10px}
.row-btns{display:flex;gap:8px}
.row-btns .btn{flex:1;padding:9px;font-size:13px}
.creds-box{background:#0a1024;border:1px dashed var(--border);border-radius:12px;padding:12px;margin:10px 0;
  font-family:monospace;font-size:14px}
.creds-box .row{display:flex;justify-content:space-between;padding:4px 0}
.creds-box b{color:#a5b8ff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;
  background:var(--card2);border:1px solid var(--border);font-size:14px;z-index:9999;animation:up .2s;max-width:90vw}
.toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--err)}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.nav-badge{background:var(--err);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;
  margin-left:4px;font-weight:700}
.ord-meta{font-size:11px;color:var(--muted);margin-top:6px;word-break:break-all;font-family:monospace}

.stars{display:inline-flex;gap:2px;font-size:16px;letter-spacing:1px}
.stars .off{color:#2d3766}
.review{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:10px}
.review-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.review-author{font-weight:600;font-size:14px}
.review-date{font-size:11px;color:var(--muted)}
.review-text{font-size:13px;line-height:1.45;margin:6px 0}
.review-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.review-photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
.seller-reply{margin-top:8px;padding:8px 10px;border-left:3px solid var(--accent);background:rgba(91,124,255,.08);
  border-radius:6px;font-size:12px}
.seller-reply b{color:#a5b8ff}
.star-input{display:flex;gap:6px;font-size:34px;justify-content:center;margin:10px 0;cursor:pointer}
.star-input span{color:#2d3766;transition:color .15s;user-select:none}
.star-input span.on{color:var(--star)}
.photo-upload{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.photo-upload .ph{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.photo-upload .ph img{width:100%;height:100%;object-fit:cover}
.photo-upload .ph button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);border:none;color:#fff;
  width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:11px}
.photo-upload label{width:72px;height:72px;border:1px dashed var(--border);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted);cursor:pointer}
.photo-upload input[type=file]{display:none}

.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 230px);background:var(--card);
  border:1px solid var(--border);border-radius:16px;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.4;word-wrap:break-word}
.msg.in{align-self:flex-start;background:var(--card2);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.out{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));border-bottom-right-radius:4px}
.msg-time{font-size:10px;opacity:.6;margin-top:3px;display:block;text-align:right}
.chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);background:var(--card2)}
.chat-input input{flex:1;margin:0}
.chat-input button{width:auto;padding:0 18px;margin:0}
.profile-name-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.profile-name-row input{margin:0;max-width:220px}
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<div id="checkoutModal" class="modal"><div class="modal-body">
  <div class="modal-head"><b>Оформление заказа</b><button class="close-btn" data-close="checkoutModal">✕</button></div>
  
  <h3>Способ получения</h3>
  <label class="pvz-option selected" id="delTypePvz" style="margin-bottom:12px;">
    <input type="radio" name="delType" value="pvz" checked style="accent-color:var(--accent);width:20px;height:20px;margin:0 4px 0 0;"/>
    <div class="pvz-info"><div class="pvz-name">В пункт выдачи (ПВЗ)</div></div>
  </label>
  <label class="pvz-option" id="delTypeCourier" style="margin-bottom:12px;">
    <input type="radio" name="delType" value="courier" style="accent-color:var(--accent);width:20px;height:20px;margin:0 4px 0 0;"/>
    <div class="pvz-info"><div class="pvz-name">Курьером до двери</div></div>
  </label>
  
  <div id="courierAddressBox" style="display:none;">
    <input id="courierAddressInput" class="input" placeholder="Адрес доставки (улица, дом, квартира)"/>
  </div>

  <h3 style="margin-top:16px;">Способ оплаты</h3>
  <label class="pvz-option selected" id="payTypeWallet" style="margin-bottom:8px;">
    <input type="radio" name="payType" value="wallet" checked style="accent-color:var(--accent);width:20px;height:20px;margin:0 4px 0 0;"/>
    <div class="pvz-info"><div class="pvz-name">Сразу (с кошелька)</div><div class="pvz-city" id="walletBalanceLabel">Баланс: 0 ₽</div></div>
  </label>
  <label class="pvz-option" id="payTypeCash" style="margin-bottom:16px;">
    <input type="radio" name="payType" value="cash" style="accent-color:var(--accent);width:20px;height:20px;margin:0 4px 0 0;"/>
    <div class="pvz-info"><div class="pvz-name">При получении</div><div class="pvz-address">Оплата курьеру или в ПВЗ</div></div>
  </label>

  <div id="pvzSelectBox">
    <input id="pvzSearch" class="input" placeholder="Поиск ПВЗ по городу…" autocomplete="off"/>
    <div id="pvzListBox" style="max-height:200px;overflow-y:auto;margin-bottom:14px;"></div>
  </div>

  <button class="btn" id="btnConfirmOrder">Подтвердить заказ</button>
</div></div>

<div id="walletModal" class="modal"><div class="modal-body">
  <div class="modal-head"><b>Пополнение кошелька</b><button class="close-btn" data-close="walletModal">✕</button></div>
  <input id="walletTopupAmount" class="input" type="number" placeholder="Сумма, ₽" min="1"/>
  <button class="btn" id="btnTopupWallet">Пополнить</button>
</div></div>

<div id="orderQrModal" class="modal"><div class="modal-body">
  <div class="modal-head"><b>Код получения</b><button class="close-btn" data-close="orderQrModal">✕</button></div>
  <p class="muted small" style="text-align:center;margin:0 0 8px" id="orderQrDesc">Покажите QR сотруднику</p>
  <div class="qr-box"><canvas id="orderQrCanvas"></canvas></div>
  <div class="code-box" id="orderCodeBox">000000</div>
  <div class="muted small" style="text-align:center">ПВЗ/Курьер: <b id="orderQrPvz">—</b></div>
  <div class="muted small" style="text-align:center;margin-top:6px" id="orderQrStatus"></div>
</div></div>

<div id="scQrModal" class="modal"><div class="modal-body">
  <div class="modal-head"><b>Вход для СЦ</b><button class="close-btn" data-close="scQrModal">✕</button></div>
  <p class="muted small" style="text-align:center;margin:0 0 8px">Покажите этот QR сотруднику СЦ для входа</p>
  <div class="qr-box"><canvas id="scQrCanvas"></canvas></div>
  <div class="code-box" id="scQrCode" style="font-size:20px;letter-spacing:2px">sc:000000</div>
</div></div>

<div id="applyPvzModal" class="modal"><div class="modal-body">
  <div class="modal-head"><b>Стать пунктом выдачи</b><button class="close-btn" data-close="applyPvzModal">✕</button></div>
  <input id="applyName" class="input" placeholder="Название ПВЗ"/>
  <input id="applyCity" class="input" placeholder="Город (например Москва)"/>
  <input id="applyAddress" class="input" placeholder="Адрес: улица, дом"/>
  <input id="applySchedule" class="input" placeholder="График работы"/>
  <button class="btn" id="btnApplyPvz">Отправить заявку</button>
</div></div>

<div id="boxQrModal" class="modal"><div class="modal-body">
  <div class="modal-head"><b>QR коробки</b><button class="close-btn" data-close="boxQrModal">✕</button></div>
  <div class="qr-box"><canvas id="boxQrCanvas"></canvas></div>
  <div class="code-box" id="boxQrCode" style="font-size:20px;letter-spacing:2px">box000000000</div>
</div></div>

<div id="productModal" class="modal"><div class="modal-body" id="productModalBody"></div></div>
<div id="reviewModal" class="modal"><div class="modal-body" id="reviewModalBody"></div></div>
<div id="photoViewer" class="modal" style="background:rgba(0,0,0,.95)"><div style="max-width:100%;max-height:100vh" id="photoViewerBody"></div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBlZ5ZtyTXgtXxSJAx1jOxwhTrzlHRJmo",
  authDomain: "bk-cashier.firebaseapp.com",
  databaseURL: "https://bk-cashier-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bk-cashier",

};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
db.goOnline();

const ADMIN_PHONE = '+79936050979';

const STATIC_PRODUCT_DEFS = [
  { id:'p1',  name:'AirPods Pro 2',       price:19990, emoji:'🎧', brand:'Apple' },
  { id:'p2',  name:'iPhone 15 128GB',     price:89990, emoji:'📱', brand:'Apple' },
  { id:'p3',  name:'Nike Air Zoom',       price:12990, emoji:'👟', brand:'Nike' },
  { id:'p4',  name:'Куртка зимняя',       price:8990,  emoji:'🧥', brand:'' },
  { id:'p5',  name:'DeLonghi Magnifica',  price:25990, emoji:'☕', brand:'DeLonghi' },
  { id:'p6',  name:'Набор кастрюль',      price:6990,  emoji:'🍳', brand:'' },
  { id:'p7',  name:'Мастер и Маргарита',  price:890,   emoji:'📚', brand:'' },
  { id:'p8',  name:'Рюкзак городской',    price:3990,  emoji:'🎒', brand:'' },
  { id:'p9',  name:'Умные часы',          price:15990, emoji:'⌚', brand:'' },
  { id:'p10', name:'Плед пушистый',       price:1990,  emoji:'🛏️', brand:'' },
  { id:'p11', name:'Пылесос-робот',       price:34990, emoji:'🤖', brand:'' },
  { id:'p12', name:'Кружка керамическая', price:590,   emoji:'🍵', brand:'' },
];
const STATIC_PRODUCTS = STATIC_PRODUCT_DEFS.map(p => ({ ...p, qr: 'prod' + p.id, isStatic: true }));

let ALL_PRODUCTS = STATIC_PRODUCTS.slice();
let PRODUCT_MAP = {};
function rebuildProductMap(){
  PRODUCT_MAP = Object.fromEntries(ALL_PRODUCTS.map(p => [p.id, p]));
}
rebuildProductMap();

const fmt = n => new Intl.NumberFormat('ru-RU').format(Number(n)||0) + ' ₽';
const digits = v => String(v||'').replace(/\D/g,'');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function formatPhone(raw){
  let d = digits(raw);
  if (d.startsWith('9')) d = '7' + d;
  if (d.length > 11) d = d.slice(0,11);
  if (!d) return '';
  let out = '+' + d[0];
  if (d.length > 1) out += ' ' + d.slice(1,4);
  if (d.length > 4) out += ' ' + d.slice(4,7);
  if (d.length > 7) out += '-' + d.slice(7,9);
  if (d.length > 9) out += '-' + d.slice(9,11);
  return out;
}
function normalizePhone(v){ let d = digits(v); if (d.startsWith('9')) d='7'+d; return '+'+d; }
function attachPhoneInput(inp){
  inp.addEventListener('input', () => {
    const f = formatPhone(inp.value);
    if (f !== inp.value){ inp.value = f; inp.setSelectionRange(f.length, f.length); }
  });
}

function renderLogin(){
  const l = loginState;
  const root = document.getElementById('root');
  let body = '';
  if (l.step === 'phone'){
    body = `
      <div class="brand"><div class="logo">К</div><h1>Курсив Маркет</h1></div>

      <div class="err" id="err"></div>
      <button class="btn" id="btnNext">Продолжить</button>
    `;
  } else {
    const isCreate = l.mode === 'create';
    const confirm = isCreate && l.pinFirst !== null;
    const title = isCreate ? (confirm ? 'Повторите PIN-код' : 'Придумайте PIN-код') : 'Введите PIN-код';
    body = `
      <div class="brand"><div class="logo">К</div><h1>Курсив Маркет</h1></div>
      <h2>${title}</h2>
      <p class="muted">${esc(l.phone||'')}</p>

      <div class="err" id="err">${esc(l.error||'')}</div>
      <button class="btn" id="btnPin">${isCreate ? (confirm?'Создать':'Далее') : 'Войти'}</button>
      <button class="btn ghost" id="btnBack" style="margin-top:8px">Назад</button>
    `;
  }
  root.innerHTML = `<div class="login-wrap"><div class="panel">${body}</div></div>`;

  if (l.step === 'phone'){
    const inp = document.getElementById('phoneInput');
    attachPhoneInput(inp); inp.focus();
    document.getElementById('btnNext').onclick = async () => {
      if (digits(inp.value).length < 11){ document.getElementById('err').textContent = 'Введите номер полностью'; return; }
      const phone = normalizePhone(inp.value);
      document.getElementById('btnNext').textContent = 'Проверяем…';
      const snap = await db.ref('users/'+phone).once('value');
      loginState.phone = phone; loginState.error = '';
      if (snap.exists()){ loginState.mode = 'login'; }
      else { loginState.mode = 'create'; loginState.pinFirst = null; }
      loginState.step = 'pin'; render();
    };
    inp.addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('btnNext').click(); });
  } else {
    const pin = document.getElementById('pinInput');
    pin.focus();
    document.getElementById('btnPin').onclick = async () => {
      const v = pin.value.trim();
      if (!/^\d{4}$/.test(v)){ loginState.error = 'PIN из 4 цифр'; render(); return; }
      if (loginState.mode === 'login'){
        const snap = await db.ref('users/'+loginState.phone+'/pin').once('value');
        if (snap.val() === v) doLogin(loginState.phone);
        else { loginState.error = 'Неверный PIN'; render(); }
      } else {
        if (loginState.pinFirst === null){ loginState.pinFirst = v; loginState.error = ''; render(); }
        else {
          if (loginState.pinFirst !== v){ loginState.error = 'PIN не совпадает'; loginState.pinFirst = null; render(); return; }
          await db.ref('users/'+loginState.phone).set({ pin: v, createdAt: Date.now(), wallet: 0 });
          doLogin(loginState.phone);
        }
      }
    };
    pin.addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('btnPin').click(); });
    document.getElementById('btnBack').onclick = () => { loginState.step='phone'; loginState.error=''; render(); };
  }
}

function safeUnsub(fn){ if (fn){ try{ fn(); }catch(e){ console.warn(e); } } }
function subscribeUser(phone){
  safeUnsub(unsubUser); unsubUser=null;
  safeUnsub(unsubPvz); unsubPvz=null;
  safeUnsub(unsubApps); unsubApps=null;
  safeUnsub(unsubOrders); unsubOrders=null;
  safeUnsub(unsubProducts); unsubProducts=null;
  safeUnsub(unsubSupport); unsubSupport=null;
  safeUnsub(unsubSupportAccs); unsubSupportAccs=null;

    renderSoon();
  };
  userRef.on('value', userCb);

  const pvzRef = db.ref('pvz');

  const prodRef = db.ref('sellerProducts');

    const sellerList = Object.entries(state.sellerProducts)
      .filter(([,p]) => p && p.active !== false)
      .map(([id,p]) => ({
        id, name: p.name || 'Без названия', brand: p.brand || '', price: Number(p.price)||0,
        photo: p.photo || '', description: p.description || '', qr: p.qr || ('prod' + id),
        sellerPhone: p.sellerPhone, isStatic: false,
      }));
    ALL_PRODUCTS = STATIC_PRODUCTS.slice().concat(sellerList);
    rebuildProductMap();
    renderSoon();
  };
  prodRef.on('value', prodCb);
  unsubProducts = () => prodRef.off('value', prodCb);

  const suppRef = db.ref('supportMessages/'+phone);
  const suppCb = snap => {
    state.supportMsgs = snap.val() || {};
    let unread = 0;
    for (const m of Object.values(state.supportMsgs)) if (m.from === 'support' && !m.readAt) unread++;
    state.supportUnread = unread;

  };
  suppRef.on('value', suppCb);
  unsubSupport = () => suppRef.off('value', suppCb);

  if (phone === ADMIN_PHONE){
    const appsRef = db.ref('pvzApplications');
    const appsCb = snap => { state.applications = snap.val() || {}; if (state.tab === 'admin') renderSoon(); };
    appsRef.on('value', appsCb);
    unsubApps = () => appsRef.off('value', appsCb);

    const ordersRef = db.ref('orderIndex');
    const ordersCb = snap => { state.orderIndex = snap.val() || {}; if (state.tab === 'admin') renderSoon(); };
    ordersRef.on('value', ordersCb);
    unsubOrders = () => ordersRef.off('value', ordersCb);

    const supAccRef = db.ref('supportAccounts');
    const supAccCb = snap => { state.supportAccounts = snap.val() || {}; if (state.tab === 'admin') renderSoon(); };
    supAccRef.on('value', supAccCb);
    unsubSupportAccs = () => supAccRef.off('value', supAccCb);

    const courRef = db.ref('couriers');
    const courCb = snap => { state.couriers = snap.val() || {}; if (state.tab === 'admin') renderSoon(); };
    courRef.on('value', courCb);
    unsubCouriers = () => courRef.off('value', courCb);

    const scRef = db.ref('sortingCenters');
    const scCb = snap => { state.sortingCenters = snap.val() || {}; if (state.tab === 'admin') renderSoon(); };
    scRef.on('value', scCb);
    unsubSCs = () => scRef.off('value', scCb);
  }
}
function logout(){
  safeUnsub(unsubUser); safeUnsub(unsubPvz); safeUnsub(unsubApps); safeUnsub(unsubOrders);
  safeUnsub(unsubProducts); safeUnsub(unsubSupport); safeUnsub(unsubSupportAccs); safeUnsub(unsubReviews);
  safeUnsub(unsubCouriers); safeUnsub(unsubSCs);
  unsubUser=unsubPvz=unsubApps=unsubOrders=unsubProducts=unsubSupport=unsubSupportAccs=unsubReviews=unsubCouriers=unsubSCs=null;

  const cart = state.user.cart || {};

async function createOrder(pvzId, deliveryType, address, paymentMethod){
  const items = getCartItems();
  if (!items.length) throw new Error('Корзина пуста');
  const total = getCartTotal(items);
  const code6 = await generateCode6();
  const boxCode = await generateBoxCode();
  const cell = Math.floor(Math.random()*250) + 1;
  const orderRef = db.ref('users/'+state.phone+'/orders').push();
  const orderId = orderRef.key;

  const units = [];
  for (const it of items){
    const baseQr = (PRODUCT_MAP[it.id] && PRODUCT_MAP[it.id].qr) || ('prod' + it.id);
    for (let i = 0; i < it.qty; i++){
      units.push({ qr: baseQr, productId: it.id, name: it.name });
    }
  }

  const cleanItems = items.map(i => {
    const o = { id: i.id, name: i.name, price: i.price, qty: i.qty };
    if (i.emoji) o.emoji = i.emoji;
    if (i.brand) o.brand = i.brand;
    if (i.photo) o.photo = i.photo;
    return o;
  });

  let pvzName = '', pvzAddress = '', pvzCity = '';
  if (deliveryType === 'pvz') {
    const pvz = state.pvzList[pvzId];
    if (!pvz) throw new Error('Выберите ПВЗ');
    pvzName = pvz.name;
    pvzAddress = pvz.address;
    pvzCity = getPvzCity(pvz);
  } else {
    pvzName = 'Курьер';
    pvzAddress = address;
    pvzCity = 'Курьерская доставка';
  }

  let payStatus = 'unpaid';
  if (paymentMethod === 'wallet') {
    const bal = state.user.wallet || 0;
    if (bal < total) throw new Error('Недостаточно средств на кошельке');
    payStatus = 'paid';
    await db.ref('users/'+state.phone+'/wallet').transaction(w => (w||0) - total);
  }

  const order = {
    items: cleanItems,
    total, pvzId: pvzId || 'courier', pvzAddress, pvzName, pvzCity,
    code6, boxCode, cell, status: 'sc_pending', ts: Date.now(),
    deliveryType, paymentMethod, paymentStatus: payStatus,
    units,
  };
  const updates = {};
  updates['users/'+state.phone+'/orders/'+orderId] = order;
  updates['users/'+state.phone+'/cart'] = null;
  updates['orderIndex/'+orderId] = {
    phone: state.phone, code6, boxCode, status: 'sc_pending',
    pvzId: pvzId || 'courier', pvzName, pvzCity,
    cell, total, ts: Date.now(), deliveryType, paymentMethod, paymentStatus: payStatus,
  };
  updates['codeIndex/'+code6] = { orderId, phone: state.phone, pvzId: pvzId || 'courier' };
  updates['boxIndex/'+boxCode] = { orderId, phone: state.phone, pvzId: pvzId || 'courier' };
  await db.ref().update(updates);
  return { orderId, code6, boxCode };
}

async function payOrder(orderId) {
  const oSnap = await db.ref('users/'+state.phone+'/orders/'+orderId).once('value');
  if (!oSnap.exists()) throw new Error('Заказ не найден');
  const o = oSnap.val();
  if (o.paymentStatus === 'paid') throw new Error('Заказ уже оплачен');
  
  const bal = state.user.wallet || 0;
  if (bal < o.total) throw new Error('Недостаточно средств. Пополните кошелек.');
  
  const updates = {};
  updates['users/'+state.phone+'/wallet'] = bal - o.total;
  updates['users/'+state.phone+'/orders/'+orderId+'/paymentStatus'] = 'paid';
  updates['orderIndex/'+orderId+'/paymentStatus'] = 'paid';
  await db.ref().update(updates);
  toast('Заказ успешно оплачен', 'ok');
}

function genPassword(len=8){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  let p = '';
  for (let i = 0; i < len; i++) p += chars[Math.floor(Math.random()*chars.length)];
  return p;
}

  updates['pvzApplications/'+appId+'/pvzId'] = pvzId;
  updates['pvzApplications/'+appId+'/login'] = login;
  updates['pvzApplications/'+appId+'/password'] = password;

function starsHtml(rating, extraClass){
  const r = Math.round(Number(rating)||0);
  let html = '<span class="stars ' + (extraClass||'') + '">';
  for (let i = 1; i <= 5; i++) html += `<span class="${i<=r?'':'off'}">★</span>`;
  return html + '</span>';
}
function avgRating(reviews){
  const arr = Object.values(reviews||{});
  if (!arr.length) return 0;
  return arr.reduce((s,r)=>s+(Number(r.rating)||0),0) / arr.length;
}
async function loadReviews(productId){
  const snap = await db.ref('reviews/'+productId).once('value');
  return snap.val() || {};
}
async function submitReview(productId, rating, text, photos){
  if (!canReview(productId)) throw new Error('Отзыв можно оставить только после покупки');
  if (!rating || rating < 1 || rating > 5) throw new Error('Поставьте оценку от 1 до 5');
  const name = (state.user.name || '').trim() || state.phone;
  const revRef = db.ref('reviews/'+productId).push();
  const review = {
    phone: state.phone, name, rating: Number(rating),
    text: String(text||'').trim(),
    photos: Array.isArray(photos) ? photos.slice(0,3) : [],
    createdAt: Date.now(),
  };
  await revRef.set(review);
}
async function compressImage(file, maxW, quality){
  maxW = maxW || 800; quality = quality || 0.7;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxW){ h = h * maxW / w; w = maxW; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        try { resolve(canvas.toDataURL('image/jpeg', quality)); } catch(e){ reject(e); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function sendSupportMessage(text){
  text = String(text||'').trim();
  if (!text) return;
  const name = (state.user.name || '').trim() || state.phone;
  const msgRef = db.ref('supportMessages/'+state.phone).push();
  const msg = { from:'client', text, ts: Date.now(), name };
  const updates = {};
  updates['supportMessages/'+state.phone+'/'+msgRef.key] = msg;
  updates['supportThreads/'+state.phone] = { phone: state.phone, name, lastMessage: text, lastTs: msg.ts, status: 'open' };
  await db.ref().update(updates);
}
async function markSupportRead(){
  const msgs = state.supportMsgs || {};
  const updates = {};
  let changed = false;
  for (const [id, m] of Object.entries(msgs)){
    if (m.from === 'support' && !m.readAt){
      updates['supportMessages/'+state.phone+'/'+id+'/readAt'] = Date.now();
      changed = true;
    }
  }
  if (changed) await db.ref().update(updates);
}

function productImgHtml(p, big){
  const sz = big ? 180 : 56;
  if (p && p.photo){
    return `<img src="${esc(p.photo)}" alt="" style="${big?'max-width:100%;max-height:'+sz+'px;border-radius:12px;object-fit:cover;display:block;margin:0 auto':'width:100%;height:100%;object-fit:cover'}"/>`;
  }
  return `<span style="font-size:${sz}px">${esc(p.emoji||'📦')}</span>`;
}

function render(){
  if (!state.phone){ renderLogin(); return; }
  if (!state.user){ document.getElementById('root').innerHTML = '<div class="empty">Загрузка…</div>'; return; }
  const isAdmin = state.phone === ADMIN_PHONE;
  const cartCount = getCartCount();
  const tabs = [
    { id:'shop', label:'Магазин' },
    { id:'cart', label:'Корзина' + (cartCount ? `<span class="nav-badge">${cartCount}</span>` : '') },
    { id:'orders', label:'Заказы' },
    { id:'support', label:'Поддержка' + (state.supportUnread ? `<span class="nav-badge">${state.supportUnread}</span>` : '') },
    { id:'profile', label:'Профиль' },
  ];
  if (isAdmin) tabs.push({ id:'admin', label:'Админ' });

  let content = '';
  switch (state.tab){
    case 'shop': content = viewShop(); break;
    case 'cart': content = viewCart(); break;
    case 'orders': content = viewOrders(); break;
    case 'support': content = viewSupport(); break;
    case 'profile': content = viewProfile(isAdmin); break;
    case 'admin': content = viewAdmin(); break;
    default: content = viewShop();
  }
  document.getElementById('root').innerHTML = `
    <div class="header">
      <div class="logo-sm">Курсив <span>Маркет</span></div>
      <div class="muted small">${esc(state.user.name || state.phone)}</div>
    </div>
    <div class="tabs">
      ${tabs.map(t=>`<button class="tab ${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('')}
    </div>
    <div class="content">${content}</div>
  `;
  bindView();
  if (state.tab === 'support') setTimeout(markSupportRead, 200);
}

function bindView(){
  const $ = id => document.getElementById(id);
  if ($('btnLogout')) $('btnLogout').onclick = logout;
  if ($('btnOpenApply')) $('btnOpenApply').onclick = () => {
    $('applyName').value=''; $('applyCity').value=''; $('applyAddress').value=''; $('applySchedule').value='';
    openModal('applyPvzModal');
  };
  if ($('btnCheckout')) $('btnCheckout').onclick = openCheckoutModal;
  if ($('btnTopupOpen')) $('btnTopupOpen').onclick = () => {
    $('walletTopupAmount').value = '';
    openModal('walletModal');
  };
  if ($('btnSaveName')) $('btnSaveName').onclick = async () => {
    const name = $('profileName').value.trim();
    await db.ref('users/'+state.phone+'/name').set(name);
    toast('Имя сохранено', 'ok');
  };
  if ($('btnSendSupport')) $('btnSendSupport').onclick = async () => {
    const inp = $('supportInput');
    const v = inp.value;
    if (!v.trim()) return;
    inp.value = '';
    try { await sendSupportMessage(v); } catch(e){ toast(e.message,'err'); }
  };
  if ($('supportInput')) $('supportInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('btnSendSupport').click();
  });
  if ($('btnCreateSup')) $('btnCreateSup').onclick = async () => {
    try {
      await createSupportAccount($('supLogin').value, $('supPass').value, $('supName').value);
      $('supLogin').value=''; $('supPass').value=''; $('supName').value='';
    } catch(e){ toast(e.message,'err'); }
  };
  if ($('btnCreateCourier')) $('btnCreateCourier').onclick = async () => {
    try {
      await createCourierAccount($('courLogin').value, $('courPass').value, $('courName').value);
      $('courLogin').value=''; $('courPass').value=''; $('courName').value='';
    } catch(e){ toast(e.message,'err'); }
  };
  if ($('btnCreateSC')) $('btnCreateSC').onclick = async () => {
    try {
      await createSortingCenter($('scName').value);
      $('scName').value = '';
    } catch(e){ toast(e.message,'err'); }
  };
  const chatMsgs = $('chatMsgs');
  if (chatMsgs) chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

function filterPvzEntries(){
  const q = (state.pvzSearch||'').trim().toLowerCase();
  const entries = Object.entries(state.pvzList);
  if (!q) return entries;
  return entries.filter(([id,p]) => getPvzCity(p).toLowerCase().startsWith(q));
}

function renderPvzList(){
  const entries = filterPvzEntries();
  const box = document.getElementById('pvzListBox');
  if (!entries.length){
    box.innerHTML = '<div class="muted small" style="padding:10px">ПВЗ не найдены</div>'; return;
  }
  box.innerHTML = entries.map(([id,p])=>`
    <div class="pvz-option ${state.selectedPvzId===id?'selected':''}" data-pvzpick="${id}">
      <div class="pvz-radio"></div>
      <div class="pvz-info">
        <div class="pvz-name">${esc(p.name)}</div>
        <div class="pvz-city">🏙 ${esc(getPvzCity(p))}</div>
        <div class="pvz-address">📍 ${esc(p.address)}</div>
      </div>
    </div>`).join('');
  box.querySelectorAll('[data-pvzpick]').forEach(el => {
    el.onclick = () => {
      state.selectedPvzId = el.dataset.pvzpick;
      box.querySelectorAll('.pvz-option').forEach(x=>x.classList.remove('selected'));
      el.classList.add('selected');
    };
  });
}

function openCheckoutModal(){
  if (!getCartItems().length){ toast('Корзина пуста','err'); return; }
  state.pvzSearch = '';
  document.getElementById('pvzSearch').value = '';
  document.getElementById('courierAddressInput').value = '';
  
  document.getElementById('walletBalanceLabel').textContent = 'Баланс: ' + fmt(state.user.wallet || 0);
  
  const delRadios = document.querySelectorAll('input[name="delType"]');
  delRadios.forEach(r => {
    r.onchange = () => {
      document.getElementById('delTypePvz').classList.toggle('selected', r.value === 'pvz' && r.checked);
      document.getElementById('delTypeCourier').classList.toggle('selected', r.value === 'courier' && r.checked);
      document.getElementById('pvzSelectBox').style.display = r.value === 'pvz' ? 'block' : 'none';
      document.getElementById('courierAddressBox').style.display = r.value === 'courier' ? 'block' : 'none';
    };
  });

  const payRadios = document.querySelectorAll('input[name="payType"]');
  payRadios.forEach(r => {
    r.onchange = () => {
      document.getElementById('payTypeWallet').classList.toggle('selected', r.value === 'wallet' && r.checked);
      document.getElementById('payTypeCash').classList.toggle('selected', r.value === 'cash' && r.checked);
    };
  });

  renderPvzList();
  document.getElementById('pvzSearch').oninput = (e) => {
    state.pvzSearch = e.target.value; renderPvzList();
  };

  document.getElementById('btnConfirmOrder').onclick = async () => {
    const delType = document.querySelector('input[name="delType"]:checked').value;
    const payType = document.querySelector('input[name="payType"]:checked').value;
    let address = '';
    
    if (delType === 'pvz' && !state.selectedPvzId) { toast('Выберите ПВЗ', 'err'); return; }
    if (delType === 'courier') {
      address = document.getElementById('courierAddressInput').value.trim();
      if (!address) { toast('Введите адрес доставки', 'err'); return; }
    }
    
    const btn = document.getElementById('btnConfirmOrder');
    btn.disabled = true; btn.textContent = 'Оформляем…';
    try {
      const { orderId } = await createOrder(state.selectedPvzId, delType, address, payType);
      closeModal('checkoutModal');
      state.selectedPvzId = null;
      toast('Заказ создан', 'ok');
      state.tab = 'orders'; render();
      setTimeout(() => showOrderQr(orderId, false), 400);
    } catch(err){ toast(err.message,'err'); }
    btn.disabled = false; btn.textContent = 'Подтвердить заказ';
  };
  openModal('checkoutModal');
}

function showOrderQr(orderId, isReturn){
  const o = (state.user.orders||{})[orderId];
  if (!o) return;
  
  let val = 'mkt:'+orderId;
  if (isReturn) {
    val = 'ret:' + orderId + ':' + getTodayStr();
    document.getElementById('orderQrDesc').textContent = 'Покажите этот QR для возврата товара (обновляется каждый день)';
  } else {
    document.getElementById('orderQrDesc').textContent = 'Покажите QR для получения заказа';
  }

  new QRious({ element: document.getElementById('orderQrCanvas'), value: val, size: 240, background: '#ffffff', foreground: '#0b1020', level: 'M' });
  document.getElementById('orderCodeBox').textContent = o.code6;
  document.getElementById('orderQrPvz').textContent = o.pvzName || o.pvzAddress || '—';
  const stEl = document.getElementById('orderQrStatus');
  stEl.innerHTML = `<span class="badge ${statusClass(o.status)}">${statusLabel(o.status)}</span>`;
  openModal('orderQrModal');
}
function showBoxQr(orderId){
  const o = state.orderIndex[orderId];
  if (!o || !o.boxCode){ toast('Нет box-кода','err'); return; }
  new QRious({ element: document.getElementById('boxQrCanvas'), value: o.boxCode, size: 240, background: '#ffffff', foreground: '#0b1020', level: 'M' });
  document.getElementById('boxQrCode').textContent = o.boxCode;
  openModal('boxQrModal');
}
function showScQr(scId) {
  new QRious({ element: document.getElementById('scQrCanvas'), value: 'sc:'+scId, size: 240, background: '#ffffff', foreground: '#0b1020', level: 'M' });
  document.getElementById('scQrCode').textContent = 'sc:'+scId;
  openModal('scQrModal');
}

async function openProductModal(productId){
  const p = PRODUCT_MAP[productId];
  if (!p) return;
  state.activeProductId = productId;
  const body = document.getElementById('productModalBody');
  body.innerHTML = `
    <div class="modal-head"><b>${esc(p.name)}</b><button class="close-btn" data-close="productModal">✕</button></div>
    <div style="text-align:center;padding:14px;background:#0f1530;border-radius:14px;margin-bottom:12px">
      ${productImgHtml(p, true)}
    </div>
    ${p.brand?`<div class="muted small" style="text-align:center;margin-bottom:4px">Бренд: <b style="color:#a5b8ff">${esc(p.brand)}</b></div>`:''}
    <div style="font-size:24px;font-weight:800;text-align:center;color:#a5b8ff;margin-bottom:8px">${fmt(p.price)}</div>
    ${p.description?`<div class="muted small" style="margin-bottom:12px;line-height:1.5">${esc(p.description)}</div>`:''}
    <button class="btn" id="btnModalAdd">В корзину</button>
    <h3 style="margin-top:18px">Отзывы <span id="revAvg" class="muted small"></span></h3>
    <div id="productReviewsBox"><div class="muted small">Загрузка…</div></div>
  `;
  document.getElementById('btnModalAdd').onclick = async () => {
    await addToCart(productId);
  };
  openModal('productModal');

  const reviews = await loadReviews(productId);
  const box = document.getElementById('productReviewsBox');
  const revList = Object.entries(reviews).map(([id,r])=>({id,...r})).sort((a,b)=>b.createdAt-a.createdAt);
  const avg = avgRating(reviews);
  const cnt = revList.length;
  document.getElementById('revAvg').innerHTML = cnt ? `· ${starsHtml(avg)} <b>${avg.toFixed(1)}</b> (${cnt})` : '';
  const canWrite = canReview(productId);
  box.innerHTML = `
    ${canWrite ? `<button class="btn ghost small" id="btnWriteReview" style="width:100%;margin-bottom:10px">★ Оставить отзыв</button>` : ''}
    ${revList.length ? revList.map(r=>`
      <div class="review">
        <div class="review-head">
          <div>
            <div class="review-author">${esc(r.name||r.phone||'Клиент')}</div>
            <div>${starsHtml(r.rating)}</div>
          </div>
          <div class="review-date">${new Date(r.createdAt).toLocaleDateString('ru-RU')}</div>
        </div>
        ${r.text?`<div class="review-text">${esc(r.text)}</div>`:''}
        ${r.photos && r.photos.length ? `<div class="review-photos">
          ${r.photos.map(src=>`<img src="${esc(src)}" data-viewphoto="${esc(src)}" alt=""/>`).join('')}
        </div>`:''}
        ${r.sellerReply?`<div class="seller-reply"><b>Ответ продавца:</b> ${esc(r.sellerReply.text)}</div>`:''}
      </div>`).join('') : '<div class="muted small" style="padding:12px;text-align:center">Пока нет отзывов</div>'}
  `;
  if (canWrite){
    document.getElementById('btnWriteReview').onclick = () => openReviewModal(productId);
  }
}

function openReviewModal(productId){
  if (!canReview(productId)){ toast('Оставить отзыв можно только после покупки','err'); return; }
  state.activeReviewProduct = productId;
  state.reviewPhotos = [];
  const p = PRODUCT_MAP[productId];
  const body = document.getElementById('reviewModalBody');
  body.innerHTML = `
    <div class="modal-head"><b>Отзыв о товаре</b><button class="close-btn" data-close="reviewModal">✕</button></div>
    <div class="muted small" style="text-align:center;margin-bottom:6px">${esc(p.name)}</div>
    <div class="star-input" id="starInput">
      ${[1,2,3,4,5].map(i=>`<span data-star="${i}">★</span>`).join('')}
    </div>
    <textarea id="reviewText" class="input" placeholder="Поделитесь впечатлением…"></textarea>
    <label class="muted small" style="display:block;margin-bottom:6px">Фото (до 3)</label>
    <div class="photo-upload" id="reviewPhotos">
      <label for="reviewFile">＋</label>
      <input type="file" id="reviewFile" accept="image/*" multiple/>
    </div>
    <button class="btn" id="btnSubmitReview">Отправить отзыв</button>
  `;
  let rating = 0;
  const stars = body.querySelectorAll('#starInput span');
  stars.forEach(s => {
    s.onclick = () => {
      rating = Number(s.dataset.star);
      stars.forEach(x => x.classList.toggle('on', Number(x.dataset.star) <= rating));
    };
  });
  const photosBox = document.getElementById('reviewPhotos');
  const fileInput = document.getElementById('reviewFile');
  fileInput.onchange = async (e) => {
    const files = Array.from(e.target.files || []);
    for (const f of files){
      if (state.reviewPhotos.length >= 3) { toast('Максимум 3 фото','err'); break; }
      try {
        const data = await compressImage(f, 800, 0.65);
        state.reviewPhotos.push(data);
      } catch(err){ console.warn(err); }
    }
    fileInput.value = '';
    const label = photosBox.querySelector('label');
    photosBox.querySelectorAll('.ph').forEach(x=>x.remove());
    state.reviewPhotos.forEach((src, idx) => {
      const div = document.createElement('div');
      div.className = 'ph';
      div.innerHTML = `<img src="${esc(src)}"/><button data-rmphoto="${idx}">✕</button>`;
      photosBox.insertBefore(div, label);
    });
    photosBox.querySelectorAll('[data-rmphoto]').forEach(b => {
      b.onclick = (ev) => {
        ev.preventDefault();
        state.reviewPhotos.splice(Number(b.dataset.rmphoto), 1);
        fileInput.dispatchEvent(new Event('change'));
      };
    });
  };
  document.getElementById('btnSubmitReview').onclick = async () => {
    const btn = document.getElementById('btnSubmitReview');
    btn.disabled = true; btn.textContent = 'Отправляем…';
    try {
      await submitReview(productId, rating, document.getElementById('reviewText').value, state.reviewPhotos);
      toast('Спасибо за отзыв!', 'ok');
      closeModal('reviewModal');
      if (state.activeProductId === productId) openProductModal(productId);
    } catch(err){
      toast(err.message, 'err');
      btn.disabled = false; btn.textContent = 'Отправить отзыв';
    }
  };
  openModal('reviewModal');
}

document.getElementById('btnTopupWallet').onclick = async () => {
  const val = Number(document.getElementById('walletTopupAmount').value);
  if (!val || val <= 0) { toast('Введите корректную сумму', 'err'); return; }
  const btn = document.getElementById('btnTopupWallet');
  btn.disabled = true; btn.textContent = 'Пополняем…';
  try {
    await db.ref('users/' + state.phone + '/wallet').transaction(w => (w || 0) + val);
    toast('Кошелек пополнен на ' + fmt(val), 'ok');
    closeModal('walletModal');
  } catch(e) {
    toast('Ошибка пополнения', 'err');
  }
  btn.disabled = false; btn.textContent = 'Пополнить';
};

document.addEventListener('click', async (e) => {
  const closeBtn = e.target.closest('[data-close]');
  if (closeBtn){ closeModal(closeBtn.dataset.close); return; }

  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn){ state.tab = tabBtn.dataset.tab; render(); return; }

  const addCart = e.target.closest('[data-addcart]');
  if (addCart){ await addToCart(addCart.dataset.addcart); return; }

  const prodView = e.target.closest('[data-prodview]');
  if (prodView && !addCart){ openProductModal(prodView.dataset.prodview); return; }

  const qtyBtn = e.target.closest('[data-qty]');
  if (qtyBtn){
    const pid = qtyBtn.dataset.qty;
    const delta = Number(qtyBtn.dataset.delta);
    const cur = Number((state.user.cart||{})[pid] || 0);
    await setCartQty(pid, cur + delta);
    return;
  }
  const rm = e.target.closest('[data-removecart]');
  if (rm){ await removeFromCart(rm.dataset.removecart); return; }

  const payBtn = e.target.closest('[data-payorder]');
  if (payBtn) {
    try { await payOrder(payBtn.dataset.payorder); } catch(err){ toast(err.message, 'err'); }
    return;
  }

  const showQr = e.target.closest('[data-showqr]');
  if (showQr){ showOrderQr(showQr.dataset.showqr, false); return; }

  const showRetQr = e.target.closest('[data-showretqr]');
  if (showRetQr){ showOrderQr(showRetQr.dataset.showretqr, true); return; }

  const revBtn = e.target.closest('[data-reviewprod]');
  if (revBtn){ openReviewModal(revBtn.dataset.reviewprod); return; }

  const viewPhoto = e.target.closest('[data-viewphoto]');
  if (viewPhoto){
    const src = viewPhoto.dataset.viewphoto;
    document.getElementById('photoViewerBody').innerHTML = `<img src="${esc(src)}" style="max-width:100%;max-height:95vh;border-radius:12px;display:block;margin:0 auto"/>`;
    openModal('photoViewer');
    return;
  }
  if (e.target.id === 'photoViewer' || (e.target.closest('#photoViewer') && !e.target.closest('img'))){
    closeModal('photoViewer');
    return;
  }

  const boxQr = e.target.closest('[data-boxqr]');
  if (boxQr){ showBoxQr(boxQr.dataset.boxqr); return; }

  const scQrBtn = e.target.closest('[data-scqr]');
  if (scQrBtn){ showScQr(scQrBtn.dataset.scqr); return; }

  const approve = e.target.closest('[data-approve]');
  if (approve){ try { await approvePvz(approve.dataset.approve); } catch(err){ toast(err.message,'err'); } return; }

  const reject = e.target.closest('[data-reject]');
  if (reject){ try { await rejectPvz(reject.dataset.reject); } catch(err){ toast(err.message,'err'); } return; }

  const delPvz = e.target.closest('[data-delpvz]');
  if (delPvz){ try { await deletePvz(delPvz.dataset.delpvz); } catch(err){ toast(err.message,'err'); } return; }

  const delSup = e.target.closest('[data-delsup]');
  if (delSup){ try { await deleteSupportAccount(delSup.dataset.delsup); } catch(err){ toast(err.message,'err'); } return; }

  const delCour = e.target.closest('[data-delcour]');
  if (delCour){ try { await deleteCourierAccount(delCour.dataset.delcour); } catch(err){ toast(err.message,'err'); } return; }

  const delSc = e.target.closest('[data-delsc]');
  if (delSc){ try { await deleteSortingCenter(delSc.dataset.delsc); } catch(err){ toast(err.message,'err'); } return; }
});

document.getElementById('btnApplyPvz').onclick = async () => {
  try {
    await submitPvzApplication(
      document.getElementById('applyName').value,
      document.getElementById('applyCity').value,
      document.getElementById('applyAddress').value,
      document.getElementById('applySchedule').value
    );
    toast('Заявка отправлена', 'ok');
    closeModal('applyPvzModal');
  } catch(err){ toast(err.message,'err'); }
};

(function boot(){
  const saved = localStorage.getItem('mkt_phone');
  if (saved){ state.phone = saved; subscribeUser(saved); }
  else render();
})();
