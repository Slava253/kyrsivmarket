<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Курсив Маркет</title>
<style>
:root{--bg:#0b1020;--card:#141b33;--card2:#1b2444;--text:#e8ecff;--muted:#8b95c2;
  --accent:#5b7cff;--accent2:#7c5bff;--ok:#25d18a;--err:#ff5b6e;--warn:#ffc107;--border:#26305a}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(1200px 800px at 20% -10%, #1a2350, #0b1020 60%);
  color:var(--text);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.logo-sm{font-weight:700;letter-spacing:.3px}
.logo-sm span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:rgba(11,16,32,.9);backdrop-filter:blur(10px);z-index:10}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--border);
  color:var(--muted);white-space:nowrap;cursor:pointer;font-size:14px;font-family:inherit;position:relative}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.content{padding:16px;flex:1;padding-bottom:40px}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);
  background:#0f1530;color:var(--text);font-size:15px;margin-bottom:10px;font-family:inherit;outline:none}
.input:focus{border-color:var(--accent)}
.pin{letter-spacing:14px;text-align:center;font-size:24px}
.code-input{letter-spacing:8px;text-align:center;font-size:22px;font-family:monospace}
.btn{width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;font-size:15px;font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:inherit;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn.small{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.btn.ok{background:var(--ok)} .btn.err{background:var(--err)}
.btn:disabled{opacity:.5;cursor:wait}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.panel{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px}
.brand{text-align:center;margin-bottom:20px}
.logo{width:56px;height:56px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-bottom:10px}
.err{color:var(--err);font-size:13px;min-height:18px;margin-bottom:8px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.prod{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;
  display:flex;flex-direction:column;gap:8px;transition:transform .15s}
.prod:hover{transform:translateY(-2px);border-color:var(--accent)}
.prod-img{font-size:56px;text-align:center;padding:14px 0;background:#0f1530;border-radius:12px}
.prod-name{font-size:14px;font-weight:600;line-height:1.3}
.prod-price{font-size:16px;font-weight:700;color:#a5b8ff}
.prod-add{padding:9px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:14px;margin-bottom:8px}
.cart-img{width:52px;height:52px;background:#0f1530;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.cart-info{flex:1}
.cart-name{font-size:14px;font-weight:600}
.cart-price{color:var(--muted);font-size:13px;margin-top:2px}
.cart-qty{display:flex;align-items:center;gap:6px}
.qty-btn{width:28px;height:28px;border-radius:8px;background:var(--card2);border:1px solid var(--border);
  color:var(--text);cursor:pointer;font-size:14px;font-family:inherit;display:flex;align-items:center;justify-content:center}
.qty-num{min-width:24px;text-align:center;font-weight:600}
.cart-remove{background:transparent;border:none;color:var(--err);font-size:18px;cursor:pointer;padding:4px 8px}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:16px;margin-top:8px;
  background:var(--card2);border-radius:14px;font-size:16px;font-weight:600}
.order{padding:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px}
.order-head{display:flex;justify-content:space-between;margin-bottom:8px}
.badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600}
.badge.pending{background:rgba(255,193,7,.15);color:var(--warn)}
.badge.issued{background:rgba(37,209,138,.15);color:var(--ok)}
.badge.active{background:rgba(37,209,138,.15);color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-body{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;
  width:100%;max-width:440px;max-height:92vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head b{font-size:17px}
.close-btn{background:transparent;border:1px solid var(--border);color:var(--muted);width:32px;height:32px;
  border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.pvz-option{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card2);
  border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.15s}
.pvz-option:hover{border-color:var(--accent)}
.pvz-option.selected{border-color:var(--accent);background:rgba(91,124,255,.12)}
.pvz-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.pvz-option.selected .pvz-radio{border-color:var(--accent)}
.pvz-option.selected .pvz-radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--accent)}
.pvz-info{flex:1}
.pvz-name{font-weight:600;font-size:14px}
.pvz-address{color:var(--muted);font-size:12px;margin-top:2px}
.qr-box{background:#fff;padding:14px;border-radius:16px;display:flex;justify-content:center;margin:14px 0}
.code-box{font-size:34px;font-weight:800;letter-spacing:6px;text-align:center;color:#a5b8ff;
  font-family:monospace;padding:16px;background:#0a1024;border-radius:14px;border:1px dashed var(--border);margin-bottom:14px}
#qrReader{width:100%;min-height:220px;border-radius:14px;overflow:hidden;background:#0a1024;border:1px solid var(--border)}
#qrReader video{border-radius:14px}
.cell-display{text-align:center;padding:24px;background:linear-gradient(135deg,#243066,#3a2a6e);
  border-radius:20px;margin-bottom:16px}
.cell-num{font-size:56px;font-weight:800;color:#fff;line-height:1}
.cell-label{color:rgba(255,255,255,.7);font-size:13px;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.app-row{padding:14px;background:var(--card2);border-radius:14px;margin-bottom:10px}
.app-head{display:flex;justify-content:space-between;margin-bottom:8px}
.app-row .address{font-size:14px;margin-bottom:4px}
.app-row .contact{color:var(--muted);font-size:12px;margin-bottom:10px}
.row-btns{display:flex;gap:8px}
.row-btns .btn{flex:1;padding:9px;font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;
  background:var(--card2);border:1px solid var(--border);font-size:14px;z-index:9999;animation:up .2s;max-width:90vw}
.toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--err)}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.nav-badge{background:var(--err);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;
  margin-left:4px;font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<!-- Модалка выбора ПВЗ -->
<div id="pvzSelectModal" class="modal">
  <div class="modal-body">
    <div class="modal-head"><b>Выберите пункт выдачи</b>
      <button class="close-btn" data-close="pvzSelectModal">✕</button></div>
    <div id="pvzListBox"></div>
    <button class="btn" id="btnConfirmOrder" style="margin-top:14px" disabled>Подтвердить заказ</button>
  </div>
</div>

<!-- Модалка QR заказа (клиент) -->
<div id="orderQrModal" class="modal">
  <div class="modal-body">
    <div class="modal-head"><b>Код получения</b>
      <button class="close-btn" data-close="orderQrModal">✕</button></div>
    <p class="muted small" style="text-align:center;margin:0 0 8px">Покажите QR или назовите код сотруднику ПВЗ</p>
    <div class="qr-box"><canvas id="orderQrCanvas"></canvas></div>
    <div class="code-box" id="orderCodeBox">000000</div>
    <div class="muted small" style="text-align:center">ПВЗ: <b id="orderQrPvz">—</b></div>
  </div>
</div>

<!-- Модалка сканера ПВЗ -->
<div id="pvzScanModal" class="modal">
  <div class="modal-body">
    <div class="modal-head"><b>Сканировать заказ</b>
      <button class="close-btn" data-close="pvzScanModal" id="btnPvzScanClose">✕</button></div>
    <div id="qrReader"></div>
    <p class="muted small" style="text-align:center;margin:14px 0 8px">или введите 6-значный код</p>
    <input id="pvzCodeInput" class="input code-input" inputmode="numeric" maxlength="6" placeholder="000000"/>
    <button class="btn" id="btnPvzCodeGo">Найти заказ</button>
  </div>
</div>

<!-- Модалка результата сканирования -->
<div id="pvzResultModal" class="modal">
  <div class="modal-body" id="pvzResultBody"></div>
</div>

<!-- Модалка заявки на ПВЗ -->
<div id="applyPvzModal" class="modal">
  <div class="modal-body">
    <div class="modal-head"><b>Стать пунктом выдачи</b>
      <button class="close-btn" data-close="applyPvzModal">✕</button></div>
    <input id="applyName" class="input" placeholder="Название ПВЗ (например «ПВЗ на Тверской»)"/>
    <input id="applyAddress" class="input" placeholder="Адрес: город, улица, дом"/>
    <button class="btn" id="btnApplyPvz">Отправить заявку</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script>
/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyBlZ5ZtyTXgtXxSJAx1jOxwhTrzlHRJmo",
  authDomain: "bk-cashier.firebaseapp.com",
  databaseURL: "https://bk-cashier-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bk-cashier",
  storageBucket: "bk-cashier.firebasestorage.app",
  messagingSenderId: "385000840969",
  appId: "1:385000840969:web:1ec8d09176b6551dc0fdd8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
db.goOnline();

/* ================= КОНСТАНТЫ ================= */
const ADMIN_PHONE = '+79936050979';
const CELLS_MAX = 250;
const PRODUCTS = [
  { id:'p1',  name:'AirPods Pro 2',          price:19990, emoji:'🎧' },
  { id:'p2',  name:'iPhone 15 128GB',         price:89990, emoji:'📱' },
  { id:'p3',  name:'Nike Air Zoom',           price:12990, emoji:'👟' },
  { id:'p4',  name:'Куртка зимняя',           price:8990,  emoji:'🧥' },
  { id:'p5',  name:'DeLonghi Magnifica',      price:25990, emoji:'☕' },
  { id:'p6',  name:'Набор кастрюль',          price:6990,  emoji:'🍳' },
  { id:'p7',  name:'Мастер и Маргарита',      price:890,   emoji:'📚' },
  { id:'p8',  name:'Рюкзак городской',        price:3990,  emoji:'🎒' },
  { id:'p9',  name:'Умные часы',              price:15990, emoji:'⌚' },
  { id:'p10', name:'Плед пушистый',           price:1990,  emoji:'🛏️' },
  { id:'p11', name:'Пылесос-робот',           price:34990, emoji:'🤖' },
  { id:'p12', name:'Кружка керамическая',     price:590,   emoji:'🍵' },
];
const PRODUCT_MAP = Object.fromEntries(PRODUCTS.map(p => [p.id, p]));

/* ================= УТИЛИТЫ ================= */
const fmt = n => new Intl.NumberFormat('ru-RU').format(Number(n)||0) + ' ₽';
const digits = v => String(v||'').replace(/\D/g,'');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function formatPhone(raw){
  let d = digits(raw);
  if (d.startsWith('9')) d = '7' + d;
  if (d.length > 11) d = d.slice(0,11);
  if (!d) return '';
  let out = '+' + d[0];
  if (d.length > 1) out += ' ' + d.slice(1,4);
  if (d.length > 4) out += ' ' + d.slice(4,7);
  if (d.length > 7) out += '-' + d.slice(7,9);
  if (d.length > 9) out += '-' + d.slice(9,11);
  return out;
}
function normalizePhone(v){
  let d = digits(v);
  if (d.startsWith('9')) d = '7' + d;
  return '+' + d;
}
function attachPhoneInput(inp){
  inp.addEventListener('input', () => {
    const f = formatPhone(inp.value);
    if (f !== inp.value){ inp.value = f; inp.setSelectionRange(f.length, f.length); }
  });
}
function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast ' + (type||'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

/* ================= СОСТОЯНИЕ ================= */
const state = {
  phone:null, user:null, tab:'shop',
  pvzList:{}, applications:{},
  selectedPvzId:null,
};
const loginState = { step:'phone', phone:null, mode:null, pinFirst:null, error:'' };
let unsubUser=null, unsubPvz=null, unsubApps=null;
let renderPending=false;
function renderSoon(){
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(()=>{ renderPending=false; render(); });
}

/* ================= АВТОРИЗАЦИЯ ================= */
function renderLogin(){
  const l = loginState;
  const root = document.getElementById('root');
  let body = '';
  if (l.step === 'phone'){
    body = `
      <div class="brand"><div class="logo">К</div><h1>Курсив Маркет</h1></div>
      <h2>Вход или регистрация</h2>
      <p class="muted">Введите номер телефона</p>
      <input id="phoneInput" class="input" inputmode="tel" placeholder="+7 999 123-45-67" autocomplete="off"/>
      <div class="err" id="err"></div>
      <button class="btn" id="btnNext">Продолжить</button>
    `;
  } else {
    const isCreate = l.mode === 'create';
    const confirm = isCreate && l.pinFirst !== null;
    const title = isCreate ? (confirm ? 'Повторите PIN-код' : 'Придумайте PIN-код (4 цифры)') : 'Введите PIN-код';
    body = `
      <div class="brand"><div class="logo">К</div><h1>Курсив Маркет</h1></div>
      <h2>${title}</h2>
      <p class="muted">${esc(l.phone||'')}</p>
      <input id="pinInput" class="input pin" inputmode="numeric" maxlength="4" type="password" placeholder="••••" autocomplete="off"/>
      <div class="err" id="err">${esc(l.error||'')}</div>
      <button class="btn" id="btnPin">${isCreate ? (confirm?'Создать':'Далее') : 'Войти'}</button>
      <button class="btn ghost" id="btnBack" style="margin-top:8px">Назад</button>
    `;
  }
  root.innerHTML = `<div class="login-wrap"><div class="panel">${body}</div></div>`;

  if (l.step === 'phone'){
    const inp = document.getElementById('phoneInput');
    attachPhoneInput(inp); inp.focus();
    document.getElementById('btnNext').onclick = async () => {
      if (digits(inp.value).length < 11){ document.getElementById('err').textContent = 'Введите номер полностью'; return; }
      const phone = normalizePhone(inp.value);
      document.getElementById('btnNext').textContent = 'Проверяем…';
      const snap = await db.ref('users/'+phone).once('value');
      loginState.phone = phone; loginState.error = '';
      if (snap.exists()){ loginState.mode = 'login'; }
      else { loginState.mode = 'create'; loginState.pinFirst = null; }
      loginState.step = 'pin'; render();
    };
    inp.addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('btnNext').click(); });
  } else {
    const pin = document.getElementById('pinInput');
    pin.focus();
    document.getElementById('btnPin').onclick = async () => {
      const v = pin.value.trim();
      if (!/^\d{4}$/.test(v)){ loginState.error = 'PIN должен быть из 4 цифр'; render(); return; }
      if (loginState.mode === 'login'){
        const snap = await db.ref('users/'+loginState.phone+'/pin').once('value');
        if (snap.val() === v) doLogin(loginState.phone);
        else { loginState.error = 'Неверный PIN'; render(); }
      } else {
        if (loginState.pinFirst === null){ loginState.pinFirst = v; loginState.error = ''; render(); }
        else {
          if (loginState.pinFirst !== v){ loginState.error = 'PIN не совпадает'; loginState.pinFirst = null; render(); return; }
          await db.ref('users/'+loginState.phone).set({ pin: v, role:'client', createdAt: Date.now() });
          doLogin(loginState.phone);
        }
      }
    };
    pin.addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('btnPin').click(); });
    document.getElementById('btnBack').onclick = () => { loginState.step='phone'; loginState.error=''; render(); };
  }
}

function doLogin(phone){
  localStorage.setItem('mkt_phone', phone);
  state.phone = phone; state.tab = 'shop';
  subscribeUser(phone);
}
function subscribeUser(phone){
  if (unsubUser){ unsubUser(); unsubUser = null; }
  unsubUser = db.ref('users/'+phone).on('value', snap => {
    if (!snap.exists()){ logout(); return; }
    state.user = snap.val(); renderSoon();
  });
  if (unsubPvz) unsubPvz();
  unsubPvz = db.ref('pvz').on('value', snap => {
    state.pvzList = snap.val() || {}; renderSoon();
  });
  if (phone === ADMIN_PHONE){
    if (unsubApps) unsubApps();
    unsubApps = db.ref('pvzApplications').on('value', snap => {
      state.applications = snap.val() || {};
      if (state.tab === 'admin') renderSoon();
    });
  }
}
function logout(){
  if (unsubUser){ unsubUser(); unsubUser=null; }
  if (unsubPvz){ unsubPvz(); unsubPvz=null; }
  if (unsubApps){ unsubApps(); unsubApps=null; }
  localStorage.removeItem('mkt_phone');
  state.phone=null; state.user=null; state.tab='shop'; state.pvzList={}; state.applications={};
  Object.assign(loginState, { step:'phone', phone:null, mode:null, pinFirst:null, error:'' });
  render();
}

/* ================= КОРЗИНА ================= */
async function addToCart(productId){
  await db.ref('users/'+state.phone+'/cart/'+productId).transaction(q => (q||0) + 1);
  toast('Добавлено в корзину', 'ok');
}
async function setCartQty(productId, qty){
  if (qty <= 0) return db.ref('users/'+state.phone+'/cart/'+productId).remove();
  await db.ref('users/'+state.phone+'/cart/'+productId).set(qty);
}
async function removeFromCart(productId){
  await db.ref('users/'+state.phone+'/cart/'+productId).remove();
}
function getCartItems(){
  const cart = state.user.cart || {};
  const items = [];
  for (const [pid, qty] of Object.entries(cart)){
    const p = PRODUCT_MAP[pid];
    if (p && qty > 0) items.push({ ...p, qty });
  }
  return items;
}
function getCartTotal(items){ return items.reduce((s,i)=>s+i.price*i.qty, 0); }
function getCartCount(){
  return Object.values(state.user.cart||{}).reduce((s,q)=>s+(Number(q)||0), 0);
}

/* ================= ОФОРМЛЕНИЕ ЗАКАЗА ================= */
async function generateCode6(){
  for (let i = 0; i < 12; i++){
    const c = String(Math.floor(Math.random()*1000000)).padStart(6,'0');
    const snap = await db.ref('codeIndex/'+c).once('value');
    if (!snap.exists()) return c;
  }
  throw new Error('Не удалось сгенерировать код, попробуйте снова');
}

async function createOrder(pvzId){
  const items = getCartItems();
  if (!items.length) throw new Error('Корзина пуста');
  const pvz = state.pvzList[pvzId];
  if (!pvz) throw new Error('Выберите ПВЗ');
  const total = getCartTotal(items);
  const code6 = await generateCode6();
  const cell = Math.floor(Math.random()*CELLS_MAX) + 1;
  const orderSnap = {
    items: items.map(i=>({ id:i.id, name:i.name, price:i.price, qty:i.qty, emoji:i.emoji })),
    total, pvzId, pvzAddress: pvz.address, pvzName: pvz.name,
    code6, cell, status: 'pending', ts: Date.now()
  };
  const orderRef = db.ref('users/'+state.phone+'/orders').push();
  const orderId = orderRef.key;
  const updates = {};
  updates['users/'+state.phone+'/orders/'+orderId] = orderSnap;
  updates['users/'+state.phone+'/cart'] = null;
  updates['orderIndex/'+orderId] = { phone: state.phone, code6, status: 'pending' };
  updates['codeIndex/'+code6] = { orderId, phone: state.phone };
  await db.ref().update(updates);
  return { orderId, code6 };
}

/* ================= ВЫДАЧА ЗАКАЗА (ПВЗ) ================= */
async function findOrderByQr(qrText){
  const orderId = String(qrText||'').trim().replace(/^mkt:/i, '').replace(/%3A/gi, ':').trim();
  if (!orderId) throw new Error('Пустой QR-код');
  const idx = await db.ref('orderIndex/'+orderId).once('value');
  if (!idx.exists()) throw new Error('Заказ не найден');
  const { phone } = idx.val();
  const oSnap = await db.ref('users/'+phone+'/orders/'+orderId).once('value');
  if (!oSnap.exists()) throw new Error('Заказ не найден');
  return { orderId, phone, order: oSnap.val() };
}
async function findOrderByCode(code6){
  code6 = digits(code6);
  if (code6.length !== 6) throw new Error('Код должен быть из 6 цифр');
  const idx = await db.ref('codeIndex/'+code6).once('value');
  if (!idx.exists()) throw new Error('Код не найден или уже использован');
  const { orderId, phone } = idx.val();
  const oSnap = await db.ref('users/'+phone+'/orders/'+orderId).once('value');
  if (!oSnap.exists()) throw new Error('Заказ не найден');
  return { orderId, phone, order: oSnap.val() };
}
async function issueOrder(orderId, phone, code6){
  const oSnap = await db.ref('users/'+phone+'/orders/'+orderId).once('value');
  if (!oSnap.exists()) throw new Error('Заказ не найден');
  const o = oSnap.val();
  if (o.status === 'issued') throw new Error('Заказ уже выдан');
  if (state.user.pvzId && o.pvzId !== state.user.pvzId) throw new Error('Заказ другого ПВЗ');
  const updates = {};
  updates['users/'+phone+'/orders/'+orderId+'/status'] = 'issued';
  updates['users/'+phone+'/orders/'+orderId+'/issuedAt'] = Date.now();
  updates['users/'+phone+'/orders/'+orderId+'/issuedBy'] = state.user.pvzId || null;
  updates['orderIndex/'+orderId+'/status'] = 'issued';
  updates['codeIndex/'+code6] = null;
  await db.ref().update(updates);
}

/* ================= ЗАЯВКА НА ПВЗ ================= */
async function submitPvzApplication(name, address){
  name = name.trim(); address = address.trim();
  if (!name || !address) throw new Error('Заполните все поля');
  // проверка существующей заявки
  const snap = await db.ref('pvzApplications').orderByChild('phone').equalTo(state.phone).once('value');
  if (snap.exists()){
    const apps = snap.val();
    for (const id in apps){
      if (apps[id].status === 'pending') throw new Error('У вас уже есть заявка на рассмотрении');
    }
  }
  await db.ref('pvzApplications').push({
    name, address, phone: state.phone, status: 'pending', ts: Date.now()
  });
}

/* ================= АДМИН ================= */
async function approvePvz(appId){
  const snap = await db.ref('pvzApplications/'+appId).once('value');
  if (!snap.exists()) throw new Error('Заявка не найдена');
  const app = snap.val();
  if (app.status !== 'pending') throw new Error('Заявка уже обработана');
  const pvzRef = db.ref('pvz').push();
  const updates = {};
  updates['pvz/'+pvzRef.key] = {
    address: app.address, name: app.name, ownerPhone: app.phone, createdAt: Date.now()
  };
  updates['users/'+app.phone+'/role'] = 'pvz';
  updates['users/'+app.phone+'/pvzId'] = pvzRef.key;
  updates['pvzApplications/'+appId+'/status'] = 'approved';
  updates['pvzApplications/'+appId+'/pvzId'] = pvzRef.key;
  await db.ref().update(updates);
  toast('ПВЗ одобрен', 'ok');
}
async function rejectPvz(appId){
  await db.ref('pvzApplications/'+appId+'/status').set('rejected');
  toast('Заявка отклонена', 'ok');
}
async function deletePvz(pvzId){
  if (!confirm('Удалить ПВЗ? Клиенты больше не смогут его выбрать.')) return;
  const snap = await db.ref('pvz/'+pvzId).once('value');
  if (!snap.exists()) return;
  const pvz = snap.val();
  const updates = { ['pvz/'+pvzId]: null };
  if (pvz.ownerPhone){
    updates['users/'+pvz.ownerPhone+'/pvzId'] = null;
    updates['users/'+pvz.ownerPhone+'/role'] = 'client';
  }
  await db.ref().update(updates);
  toast('ПВЗ удалён', 'ok');
}

/* ================= ПВЗ: СКАНИРОВАНИЕ ================= */
let pvzScanner = null;
let pvzScanBusy = false;
let pendingPvzOrder = null; // { orderId, phone, order }

async function openPvzScanModal(){
  document.getElementById('pvzCodeInput').value = '';
  openModal('pvzScanModal');
  if (!pvzScanner){
    try { pvzScanner = new Html5Qrcode('qrReader'); }
    catch(e){ console.warn('scanner init', e); return; }
  }
  pvzScanBusy = false;
  try {
    await pvzScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      (text) => onPvzQr(text),
      () => {}
    );
  } catch(err){
    console.warn('camera err', err);
    toast('Камера недоступна — введите код вручную', 'err');
  }
}
async function stopPvzScanner(){
  if (pvzScanner){ try { await pvzScanner.stop(); } catch(e){} }
}
async function onPvzQr(text){
  if (pvzScanBusy) return;
  pvzScanBusy = true;
  await stopPvzScanner();
  closeModal('pvzScanModal');
  try { await processPvzLookup({ qr: text }); }
  catch(err){ toast(err.message,'err'); }
  pvzScanBusy = false;
}
async function processPvzLookup(input){
  let result;
  if (input.qr) result = await findOrderByQr(input.qr);
  else if (input.code) result = await findOrderByCode(input.code);
  else throw new Error('Нет данных');
  if (result.order.status === 'issued') throw new Error('Заказ уже выдан');
  if (state.user.pvzId && result.order.pvzId !== state.user.pvzId)
    throw new Error('Заказ другого ПВЗ');
  pendingPvzOrder = result;
  renderPvzResult(result);
  openModal('pvzResultModal');
}

  document.getElementById('pvzResultBody').innerHTML = `

      <div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
        <span class="muted">Итого</span><b>${fmt(order.total)}</b>
      </div>
    </div>

      <div class="row-between" style="margin-bottom:6px"><span class="muted">Клиент</span><b>${esc(phone)}</b></div>

  document.getElementById('btnPvzResClose').onclick = () => {

  document.getElementById('btnPvzIssue').onclick = async () => {

/* ================= ГЛОБАЛЬНЫЕ ОБРАБОТЧИКИ ================= */
document.addEventListener('click', async (e) => {
  const closeBtn = e.target.closest('[data-close]');
  if (closeBtn){
    closeModal(closeBtn.dataset.close);
    if (closeBtn.dataset.close === 'pvzScanModal') await stopPvzScanner();
    return;
  }

  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn){ state.tab = tabBtn.dataset.tab; render(); return; }

  const addCart = e.target.closest('[data-addcart]');
  if (addCart){ await addToCart(addCart.dataset.addcart); return; }

  const qtyBtn = e.target.closest('[data-qty]');
  if (qtyBtn){
    const pid = qtyBtn.dataset.qty;
    const delta = Number(qtyBtn.dataset.delta);
    const cur = Number((state.user.cart||{})[pid] || 0);
    await setCartQty(pid, cur + delta);
    return;
  }

  const rmCart = e.target.closest('[data-removecart]');
  if (rmCart){ await removeFromCart(rmCart.dataset.removecart); return; }

  const showQr = e.target.closest('[data-showqr]');
  if (showQr){ showOrderQr(showQr.dataset.showqr); return; }

  const approve = e.target.closest('[data-approve]');
  if (approve){
    try { await approvePvz(approve.dataset.approve); }
    catch(err){ toast(err.message,'err'); }
    return;
  }
  const reject = e.target.closest('[data-reject]');
  if (reject){
    try { await rejectPvz(reject.dataset.reject); }
    catch(err){ toast(err.message,'err'); }
    return;
  }
  const delPvz = e.target.closest('[data-delpvz]');
  if (delPvz){
    try { await deletePvz(delPvz.dataset.delpvz); }
    catch(err){ toast(err.message,'err'); }
    return;
  }
});

document.getElementById('btnPvzScanClose').onclick = async () => {
  closeModal('pvzScanModal');
  await stopPvzScanner();
};
document.getElementById('btnPvzCodeGo').onclick = async () => {
  const v = document.getElementById('pvzCodeInput').value;
  try {
    closeModal('pvzScanModal');
    await stopPvzScanner();
    await processPvzLookup({ code: v });
  } catch(err){ toast(err.message,'err'); }
};
document.getElementById('pvzCodeInput').addEventListener('input', e => { e.target.value = digits(e.target.value); });
document.getElementById('pvzCodeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btnPvzCodeGo').click();
});

document.getElementById('btnApplyPvz').onclick = async () => {
  const name = document.getElementById('applyName').value;
  const addr = document.getElementById('applyAddress').value;
  try {
    await submitPvzApplication(name, addr);
    toast('Заявка отправлена', 'ok');
    closeModal('applyPvzModal');
  } catch(err){ toast(err.message,'err'); }
};

/* ================= СТАРТ ================= */
(function boot(){
  const saved = localStorage.getItem('mkt_phone');
  if (saved){ state.phone = saved; subscribeUser(saved); }
  else render();
})();
</script>
