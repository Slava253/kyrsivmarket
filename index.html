<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Курсив банк</title>
<style>
:root{--bg:#0b1020;--card:#141b33;--card2:#1b2444;--text:#e8ecff;--muted:#8b95c2;
  --accent:#5b7cff;--accent2:#7c5bff;--ok:#25d18a;--err:#ff5b6e;--border:#26305a}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(1200px 800px at 20% -10%, #1a2350, #0b1020 60%);
  color:var(--text);min-height:100vh}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.logo-sm{font-weight:700;letter-spacing:.3px}
.logo-sm span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.header .right{display:flex;gap:8px;align-items:center}
.phone{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:rgba(11,16,32,.85);backdrop-filter:blur(10px);z-index:10}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--border);
  color:var(--muted);white-space:nowrap;cursor:pointer;font-size:14px;font-family:inherit}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.content{padding:16px;flex:1}
h1,h2,h3{margin:0 0 12px}
h2{font-size:20px}
h3{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.balance-card{background:linear-gradient(135deg,#243066,#3a2a6e);border-radius:20px;padding:20px;margin-bottom:14px;
  box-shadow:0 10px 30px rgba(91,124,255,.25);transition:box-shadow .3s}
.big{font-size:34px;font-weight:700;margin:6px 0 14px;transition:transform .3s}
.big.bump{animation:balanceBump .6s ease}
@keyframes balanceBump{0%{transform:scale(1)}40%{transform:scale(1.08);color:#a5b8ff}100%{transform:scale(1)}}
.mid{font-size:18px;font-weight:600}
.row{display:flex;gap:24px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);
  background:#0f1530;color:var(--text);font-size:15px;margin-bottom:10px;font-family:inherit;outline:none}
.input:focus{border-color:var(--accent)}
.pin{letter-spacing:14px;text-align:center;font-size:24px}
.btn{width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;font-size:15px;font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:inherit;
  transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn.small{width:auto;padding:7px 12px;font-size:13px;border-radius:10px}
.btn.ok{background:var(--ok)} .btn.err{background:var(--err)}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.panel{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px}
.brand{text-align:center;margin-bottom:20px}
.logo{width:56px;height:56px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-bottom:10px}
.err{color:var(--err);font-size:13px;min-height:18px;margin-bottom:8px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.quick button{padding:16px 6px;border-radius:14px;background:var(--card);border:1px solid var(--border);
  color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}
.quick button:hover{border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:6px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--border);
  color:var(--text);font-size:13px;cursor:pointer;font-family:inherit}
.bank-card{background:linear-gradient(135deg,#2a2f6b,#4a2f7a);border:none;position:relative;transition:transform .2s,box-shadow .2s}
.bank-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(91,124,255,.35)}
.card-num{font-size:18px;letter-spacing:2px;margin:8px 0;font-family:monospace}
.pending{padding:12px;border-radius:12px;background:rgba(255,193,7,.12);border:1px solid rgba(255,193,7,.4);
  color:#ffc107;font-size:14px;margin-bottom:12px}
.frozen{padding:10px;border-radius:12px;background:rgba(255,91,110,.15);border:1px solid var(--err);
  color:var(--err);font-size:14px;margin-top:12px;text-align:center}
.empty{padding:30px;text-align:center;color:var(--muted)}
.hist-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:14px;margin-bottom:8px;
  animation:histIn .3s ease}
@keyframes histIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.hist-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--card2);font-size:16px;flex-shrink:0}
.hist-icon.pos{background:rgba(37,209,138,.15);color:var(--ok)}
.hist-icon.neg{background:rgba(255,91,110,.15);color:var(--err)}
.hist-main{flex:1;font-size:14px}
.hist-amt{font-weight:700;font-size:14px}
.hist-amt.pos{color:var(--ok)} .hist-amt.neg{color:var(--err)}
.progress{height:8px;border-radius:999px;background:#0f1530;overflow:hidden;margin:8px 0}
.progress > div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.badge{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600}
.badge.ok{background:rgba(37,209,138,.15);color:var(--ok)}
.badge.err{background:rgba(255,91,110,.15);color:var(--err)}
.admin-row{padding:12px;border-radius:12px;background:var(--card2);margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;
  background:var(--card2);border:1px solid var(--border);font-size:14px;z-index:999;animation:up .2s}
.toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--err)}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ===== МОДАЛКИ QR ===== */
.qr-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:20px}
.qr-modal.show{display:flex}
.qr-modal-body{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;
  width:100%;max-width:420px;max-height:90vh;overflow-y:auto}
#qrReader{width:100%;min-height:220px;border-radius:12px;overflow:hidden;background:#0a1024;border:1px solid var(--border)}
#qrReader video{border-radius:12px}
/* ===== АНИМАЦИЯ ТРАНЗАКЦИИ ===== */
.anim-overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;z-index:9999;animation:animFade 1.5s ease forwards}
.anim-icon{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:48px;font-weight:800;color:#fff;margin-bottom:14px;
  animation:animPop .55s cubic-bezier(.2,.9,.3,1.4)}
.anim-icon.ok{background:linear-gradient(135deg,#25d18a,#1fa870);box-shadow:0 12px 48px rgba(37,209,138,.55)}
.anim-icon.out{background:linear-gradient(135deg,#5b7cff,#7c5bff);box-shadow:0 12px 48px rgba(91,124,255,.55)}
.anim-amt{font-size:26px;font-weight:800;animation:animSlide .5s ease .1s both;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.anim-amt.pos{color:#5feeb4} .anim-amt.neg{color:#fff}
.anim-label{color:var(--muted);font-size:13px;margin-top:6px;animation:animSlide .5s ease .2s both}
@keyframes animFade{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}
@keyframes animPop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes animSlide{0%{transform:translateY(16px);opacity:0}100%{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<!-- Модалка сканера QR -->
<div id="qrModal" class="qr-modal">
  <div class="qr-modal-body">
    <div class="row-between" style="margin-bottom:12px">
      <b>Сканирование QR</b>
      <button class="btn ghost small" id="btnQrModalClose">✕</button>
    </div>
    <div id="qrReader"></div>
    <div class="muted small" style="text-align:center;margin:12px 0">или введите код вручную</div>
    <input id="qrManualInput" class="input" placeholder="Код платежа (например p123abc)"/>
    <button class="btn" id="btnQrManualGo">Продолжить</button>
  </div>
</div>

<!-- Модалка подтверждения -->
<div id="qrConfirmModal" class="qr-modal">
  <div class="qr-modal-body">
    <h2 style="text-align:center">Оплата по QR</h2>
    <div class="muted" style="text-align:center">Сумма к оплате</div>
    <div class="big" style="text-align:center;margin:10px 0 20px" id="qrConfirmAmount">0 ₽</div>
    <button class="btn" id="btnQrConfirmPay" style="margin-bottom:8px">Оплатить</button>
    <button class="btn ghost" id="btnQrConfirmCancel">Отмена</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
/* ========== FIREBASE ========== */
const firebaseConfig = {
  apiKey: "AIzaSyBlZ5ZtyTXgtXxSJAx1jOxwhTrzlHRJmo",
  authDomain: "bk-cashier.firebaseapp.com",
  databaseURL: "https://bk-cashier-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bk-cashier",
  storageBucket: "bk-cashier.firebasestorage.app",
  messagingSenderId: "385000840969",
  appId: "1:385000840969:web:1ec8d09176b6551dc0fdd8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
db.goOnline();

/* ========== УТИЛИТЫ ========== */
const ADMIN_PHONE = '+79936050979';
const WELCOME_BONUS = 1000;
const QR_TTL = 5 * 60 * 1000;

const fmt = n => new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n)||0) + ' ₽';
const parseAmount = v => Math.round((parseFloat(String(v).replace(',','.'))||0)*100)/100;
const escapeHtml = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digitsPhone = v => String(v||'').replace(/\D/g,'');
const saneId = s => String(s).replace(/[^a-zA-Z0-9]/g,'_');

function formatPhone(raw){
  let d = digitsPhone(raw);
  if (d.startsWith('9')) d = '7' + d;
  if (d.length > 11) d = d.slice(0,11);
  if (!d) return '';
  let out = '+' + d[0];
  if (d.length > 1) out += ' ' + d.slice(1,4);
  if (d.length > 4) out += ' ' + d.slice(4,7);
  if (d.length > 7) out += '-' + d.slice(7,9);
  if (d.length > 9) out += '-' + d.slice(9,11);
  return out;
}
function normalizePhone(v){
  let d = digitsPhone(v);
  if (d.startsWith('9')) d = '7' + d;
  return '+' + d;
}
function formatCardNum(n){ return String(n).replace(/(\d{4})(?=\d)/g,'$1 '); }

function attachPhoneInput(inp){
  inp.addEventListener('input', () => {
    const f = formatPhone(inp.value);
    if (f !== inp.value){ inp.value = f; inp.setSelectionRange(f.length, f.length); }
  });
}
function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast ' + (type||'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
function celebrate(positive, amount, label){
  const el = document.createElement('div');
  el.className = 'anim-overlay';
  el.innerHTML = `
    <div class="anim-icon ${positive?'ok':'out'}">${positive?'✓':'↑'}</div>
    <div class="anim-amt ${positive?'pos':'neg'}">${positive?'+':'−'}${fmt(amount)}</div>
    <div class="anim-label">${escapeHtml(label||'Операция выполнена')}</div>
  `;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1600);
}
function bumpBalance(){
  setTimeout(() => {
    const big = document.querySelector('.big');
    if (big){ big.classList.add('bump'); setTimeout(()=>big.classList.remove('bump'), 700); }
  }, 100);
}

/* ========== СОСТОЯНИЕ ========== */
const state = { phone:null, user:null, tab:'home', usersAll:null };
const loginState = { step:'phone', phone:null, mode:null, pinFirst:null, error:'' };
let unsubUser = null, unsubAll = null;
let renderPending = false;
function renderSoon(){
  if (renderPending) return;
  renderPending = true;
  requestAnimationFrame(()=>{ renderPending = false; render(); });
}

/* ========== АВТОРИЗАЦИЯ ========== */
function renderLogin(){
  const l = loginState;
  const root = document.getElementById('root');
  let body = '';
  if (l.step === 'phone'){
    body = `
      <div class="brand"><div class="logo">К</div><h1>Курсив банк</h1></div>
      <h2>Вход или регистрация</h2>
      <p class="muted">Введите номер телефона</p>
      <input id="phoneInput" class="input" inputmode="tel" placeholder="+7 999 123-45-67" autocomplete="off"/>
      <div class="err" id="err"></div>
      <button class="btn" id="btnNext">Продолжить</button>
    `;
  } else {
    const isCreate = l.mode === 'create';
    const confirm = isCreate && l.pinFirst !== null;
    const title = isCreate ? (confirm ? 'Повторите PIN-код' : 'Придумайте PIN-код (4 цифры)') : 'Введите PIN-код';
    body = `
      <div class="brand"><div class="logo">К</div><h1>Курсив банк</h1></div>
      <h2>${title}</h2>
      <p class="muted">${escapeHtml(l.phone||'')}</p>
      <input id="pinInput" class="input pin" inputmode="numeric" maxlength="4" type="password" placeholder="••••" autocomplete="off"/>
      <div class="err" id="err">${escapeHtml(l.error||'')}</div>
      <button class="btn" id="btnPin">${isCreate ? (confirm?'Создать':'Далее') : 'Войти'}</button>
      <button class="btn ghost" id="btnBack" style="margin-top:8px">Назад</button>
    `;
  }
  root.innerHTML = `<div class="login-wrap"><div class="panel">${body}</div></div>`;

  if (l.step === 'phone'){
    const inp = document.getElementById('phoneInput');
    attachPhoneInput(inp);
    inp.focus();
    document.getElementById('btnNext').onclick = async () => {
      const raw = inp.value;
      if (digitsPhone(raw).length < 11){ document.getElementById('err').textContent = 'Введите номер полностью'; return; }
      const phone = normalizePhone(raw);
      document.getElementById('btnNext').textContent = 'Проверяем…';
      const snap = await db.ref('users/'+phone).once('value');
      loginState.phone = phone;
      loginState.error = '';
      if (snap.exists()){ loginState.mode = 'login'; }
      else { loginState.mode = 'create'; loginState.pinFirst = null; }
      loginState.step = 'pin';
      render();
    };
    inp.addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('btnNext').click(); });
  } else {
    const pin = document.getElementById('pinInput');
    pin.focus();
    document.getElementById('btnPin').onclick = async () => {
      const v = pin.value.trim();
      if (!/^\d{4}$/.test(v)){ loginState.error = 'PIN должен состоять из 4 цифр'; render(); return; }
      if (loginState.mode === 'login'){
        const snap = await db.ref('users/'+loginState.phone+'/pin').once('value');
        if (snap.val() === v){ doLogin(loginState.phone); }
        else { loginState.error = 'Неверный PIN'; render(); }
      } else {
        if (loginState.pinFirst === null){
          loginState.pinFirst = v; loginState.error = ''; render();
        } else {
          if (loginState.pinFirst !== v){
            loginState.error = 'PIN-коды не совпадают'; loginState.pinFirst = null; render(); return;
          }
          await db.ref('users/'+loginState.phone).set({
            pin: v, balance: WELCOME_BONUS, savings: 0, frozen: false, createdAt: Date.now()
          });
          doLogin(loginState.phone);
        }
      }
    };
    pin.addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('btnPin').click(); });
    document.getElementById('btnBack').onclick = () => { loginState.step='phone'; loginState.error=''; render(); };
  }
}
function doLogin(phone){
  localStorage.setItem('cbank_phone', phone);
  state.phone = phone; state.tab = 'home';
  subscribeUser(phone);
}
function subscribeUser(phone){
  if (unsubUser){ unsubUser(); unsubUser = null; }
  unsubUser = db.ref('users/'+phone).on('value', snap => {
    if (!snap.exists()){ logout(); return; }
    state.user = snap.val();
    renderSoon();
  });
  if (phone === ADMIN_PHONE){
    if (unsubAll) unsubAll();
    unsubAll = db.ref('users').on('value', s => {
      state.usersAll = s.val() || {};
      if (state.tab === 'admin') renderSoon();
    });
  }
}
function logout(){
  if (unsubUser){ unsubUser(); unsubUser = null; }
  if (unsubAll){ unsubAll(); unsubAll = null; }
  localStorage.removeItem('cbank_phone');
  state.phone = null; state.user = null; state.tab = 'home'; state.usersAll = null;
  Object.assign(loginState, { step:'phone', phone:null, mode:null, pinFirst:null, error:'' });
  render();
}

/* ========== ОПЕРАЦИИ ========== */
async function pushHistory(phone, entry){
  return db.ref('users/'+phone+'/history').push({ ...entry, ts: Date.now() });
}
function checkNotFrozen(){
  if (!state.user) throw new Error('Нет данных');
  if (state.user.frozen) throw new Error('Аккаунт заморожен');
}

async function opTransferByPhone(toPhone, amountRaw, note){
  checkNotFrozen();
  const a = parseAmount(amountRaw);
  if (!(a > 0)) throw new Error('Сумма должна быть больше 0');
  if (toPhone === state.phone) throw new Error('Нельзя перевести самому себе');
  const toSnap = await db.ref('users/'+toPhone).once('value');
  if (!toSnap.exists()) throw new Error('Получатель не найден');
  if (toSnap.val().frozen) throw new Error('Получатель заморожен');
  const res = await db.ref('users/'+state.phone+'/balance').transaction(b => {
    const bal = b || 0;
    if (bal < a) return;
    return bal - a;
  });
  if (!res.committed) throw new Error('Недостаточно средств');
  await db.ref('users/'+toPhone+'/balance').transaction(b => (b||0) + a);
  await pushHistory(state.phone, { type:'out', amount:a, to:toPhone, note: note||'' });
  await pushHistory(toPhone,      { type:'in',  amount:a, from:state.phone, note: note||'' });
  celebrate(false, a, 'Перевод выполнен'); bumpBalance();
}
async function opSelfTransfer(fromAcc, toAcc, amountRaw){
  checkNotFrozen();
  const a = parseAmount(amountRaw);
  if (!(a > 0)) throw new Error('Сумма должна быть больше 0');
  if (fromAcc === toAcc) throw new Error('Выберите разные счета');
  const base = 'users/'+state.phone+'/';
  const res = await db.ref(base+fromAcc).transaction(b => {
    const bal = b || 0;
    if (bal < a) return;
    return bal - a;
  });
  if (!res.committed) throw new Error('Недостаточно средств');
  await db.ref(base+toAcc).transaction(b => (b||0) + a);
  await pushHistory(state.phone, { type:'self', amount:a, from:fromAcc, to:toAcc, note:'Между своими счетами' });
  celebrate(false, a, 'Перевод между счетами'); bumpBalance();
}
async function opTopUpAccount(amountRaw){
  checkNotFrozen();
  const a = parseAmount(amountRaw);
  if (!(a > 0)) throw new Error('Сумма должна быть больше 0');
  await db.ref('users/'+state.phone+'/balance').transaction(b => (b||0) + a);
  await pushHistory(state.phone, { type:'topup', amount:a, note:'Пополнение счёта' });
  celebrate(true, a, 'Счёт пополнен'); bumpBalance();
}
async function opGoalContribute(goalId, amountRaw){
  checkNotFrozen();
  const a = parseAmount(amountRaw);
  if (!(a > 0)) throw new Error('Сумма должна быть больше 0');
  const res = await db.ref('users/'+state.phone+'/balance').transaction(b => {
    const bal = b || 0;
    if (bal < a) return;
    return bal - a;
  });
  if (!res.committed) throw new Error('Недостаточно средств');
  await db.ref('users/'+state.phone+'/goals/'+goalId+'/saved').transaction(b => (b||0) + a);
  await pushHistory(state.phone, { type:'goal', amount:a, goalId, note:'Пополнение цели' });
  celebrate(false, a, 'Отложено в цель'); bumpBalance();
}
async function requestCard(){
  checkNotFrozen();
  if (state.user.cardOrder && state.user.cardOrder.status === 'pending') throw new Error('Заявка уже отправлена');
  await db.ref('users/'+state.phone+'/cardOrder').set({ status:'pending', ts: Date.now() });
}
async function adminIssueCard(phone){
  const inp = document.getElementById('cardNum_'+saneId(phone));
  const cardNumber = (inp ? inp.value : '').replace(/\D/g,'');
  if (!cardNumber) { toast('Введите номер карты (цифры)', 'err'); return; }
  await db.ref('users/'+phone+'/cards/'+cardNumber).set({ createdAt: Date.now() });
  await db.ref('cards/'+cardNumber).set({ phone, createdAt: Date.now() });
  await db.ref('users/'+phone+'/cardOrder').remove();
  toast('Карта выдана клиенту ' + phone, 'ok');
}
async function adminFreeze(phone, freeze){
  await db.ref('users/'+phone+'/frozen').set(freeze);
  toast(freeze ? 'Клиент заморожен' : 'Клиент разморожен', 'ok');
}

/* ========== QR-ОПЛАТА (клиент) ========== */
let html5QrCode = null;
let pendingQrId = null;

async function openQrScanner(){
  document.getElementById('qrModal').classList.add('show');
  document.getElementById('qrManualInput').value = '';
  if (!html5QrCode){
    try { html5QrCode = new Html5Qrcode('qrReader'); }
    catch(e){ console.warn('scanner init', e); return; }
  }
  try {
    await html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 240, height: 240 } },
      (text) => { stopQrScanner(); closeQrModal(); handleQrScan(text); },
      () => {}
    );
  } catch(err){
    console.warn('camera error', err);
    toast('Камера недоступна — введите код вручную', 'err');
  }
}
async function stopQrScanner(){
  if (html5QrCode){
    try { await html5QrCode.stop(); } catch(e){}
  }
}
async function closeQrModal(){
  document.getElementById('qrModal').classList.remove('show');
  await stopQrScanner();
}
function parseQrContent(text){
  text = String(text||'').trim();
  if (text.startsWith('cursivpay:')) return text.slice(10);
  return text;
}
async function handleQrScan(text){
  const id = parseQrContent(text);
  if (!id){ toast('Неверный QR', 'err'); return; }
  try {
    const snap = await db.ref('qr_payments/'+id).once('value');
    const p = snap.val();
    if (!p) throw new Error('QR не найден');
    if (p.status !== 'pending') throw new Error('QR уже использован');
    if (Date.now() - p.ts > QR_TTL) throw new Error('QR истёк');
    pendingQrId = id;
    document.getElementById('qrConfirmAmount').textContent = fmt(p.amount);
    document.getElementById('qrConfirmModal').classList.add('show');
  } catch(err){ toast(err.message, 'err'); }
}
async function confirmQrPayment(){
  if (!pendingQrId) return;
  const id = pendingQrId;
  pendingQrId = null;
  document.getElementById('qrConfirmModal').classList.remove('show');
  try {
    checkNotFrozen();
    const qrSnap = await db.ref('qr_payments/'+id).once('value');
    const qr = qrSnap.val();
    if (!qr) throw new Error('QR не найден');
    if (qr.status !== 'pending') throw new Error('Уже оплачен');
    if (Date.now() - qr.ts > QR_TTL) throw new Error('QR истёк');

    // 1. Списываем с основного счёта
    const balRes = await db.ref('users/'+state.phone+'/balance').transaction(b => {
      const bal = b || 0;
      if (bal < qr.amount) return;
      return bal - qr.amount;
    });
    if (!balRes.committed) throw new Error('Недостаточно средств');

    // 2. Атомарно помечаем QR оплаченным
    const qrRes = await db.ref('qr_payments/'+id).transaction(p => {
      if (!p || p.status !== 'pending') return;
      return { ...p, status: 'paid', paidBy: state.phone, paidAt: Date.now() };
    });
    if (!qrRes.committed){
      // откат — кто-то оплатил параллельно
      await db.ref('users/'+state.phone+'/balance').transaction(b => (b||0) + qr.amount);
      throw new Error('Платёж уже был оплачен');
    }

    await pushHistory(state.phone, {
      type:'qr', amount: qr.amount, paymentId: id, note:'Оплата по QR'
    });
    celebrate(false, qr.amount, 'Оплата по QR');
    bumpBalance();
    toast('Оплачено', 'ok');
  } catch(err){ toast(err.message, 'err'); }
}

document.getElementById('btnQrModalClose').onclick = closeQrModal;
document.getElementById('btnQrConfirmCancel').onclick = () => {
  pendingQrId = null;
  document.getElementById('qrConfirmModal').classList.remove('show');
};
document.getElementById('btnQrConfirmPay').onclick = confirmQrPayment;
document.getElementById('btnQrManualGo').onclick = async () => {
  const v = document.getElementById('qrManualInput').value.trim();
  if (!v) return;
  await closeQrModal();
  handleQrScan(v);
};

/* ========== РЕНДЕР ========== */
function render(){
  if (!state.phone){ renderLogin(); return; }
  const root = document.getElementById('root');
  if (!state.user){
    root.innerHTML = `<div class="empty">Загрузка…</div>`;
    return;
  }
  const isAdmin = state.phone === ADMIN_PHONE;
  const tabs = [
    {id:'home', label:'Главная'},
    {id:'transfers', label:'Переводы'},
    {id:'cards', label:'Карты'},
    {id:'history', label:'История'},
    {id:'more', label:'Ещё'},
  ];
  if (isAdmin) tabs.push({id:'admin', label:'Админ'});

  let content = '';
  switch (state.tab){
    case 'home': content = viewHome(); break;
    case 'transfers': content = viewTransfers(); break;
    case 'cards': content = viewCards(); break;
    case 'history': content = viewHistory(); break;
    case 'more': content = viewMore(); break;
    case 'admin': content = viewAdmin(); break;
    default: content = viewHome();
  }

  root.innerHTML = `
    <div class="header">
      <div class="logo-sm">Курсив <span>банк</span></div>
      <div class="right">
        <span class="phone">${state.phone}</span>
        <button class="btn ghost small" id="btnLogout">Выйти</button>
      </div>
    </div>
    <div class="tabs">
      ${tabs.map(t=>`<button class="tab ${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('')}
    </div>
    <div class="content">${content}</div>
  `;
  bindView();
}

function viewHome(){
  const u = state.user;
  return `
    <div class="balance-card">
      <div class="muted">Основной счёт</div>
      <div class="big">${fmt(u.balance||0)}</div>
      <div class="row">
        <div><div class="muted small">Накопительный</div><div class="mid">${fmt(u.savings||0)}</div></div>
        <div><div class="muted small">Карт</div><div class="mid">${Object.keys(u.cards||{}).length}</div></div>
        <div><div class="muted small">Целей</div><div class="mid">${Object.keys(u.goals||{}).length}</div></div>
      </div>
      ${u.frozen ? '<div class="frozen">Аккаунт заморожен</div>' : ''}
    </div>
    <div class="quick">
      <button data-tab="transfers">Перевод</button>
      <button data-qrscan="1">QR-оплата</button>
      <button data-tab="history">История</button>
    </div>
    <div class="card">
      <h3>Последние операции</h3>
      ${(() => {
        const arr = Object.entries(u.history||{}).map(([id,v])=>({id,...v})).sort((a,b)=>b.ts-a.ts).slice(0,3);
        if (!arr.length) return '<div class="muted small">Операций пока нет</div>';
        return arr.map(historyRow).join('');
      })()}
    </div>
  `;
}

    <div class="card">

function viewCards(){
  const u = state.user;
  const cards = Object.entries(u.cards||{});
  return `
    <h2>Карты</h2>
    ${cards.length ? cards.map(([num])=>`
      <div class="card bank-card">
        <div class="muted small">Курсив банк</div>
        <div class="card-num">${formatCardNum(num)}</div>
        <div class="mid">${fmt(u.balance||0)}</div>
        <div class="muted small">баланс основного счёта</div>
      </div>
    `).join('') : '<div class="empty">У вас пока нет карт</div>'}
    ${u.cardOrder && u.cardOrder.status === 'pending'
      ? '<div class="pending">Заявка на выпуск карты отправлена. Ожидайте — админ выдаст номер.</div>'
      : '<button class="btn" id="btnOrderCard" style="margin-bottom:14px">Выпустить карту</button>'}
  `;
}

function historyRow(e){
  let title='', amt='', cls='';
  switch(e.type){
    case 'out':        title='Перевод на '+ (e.to||''); amt='−'+fmt(e.amount); cls='neg'; break;
    case 'in':         title='Перевод от '+ (e.from||''); amt='+'+fmt(e.amount); cls='pos'; break;
    case 'self':       title='Между счетами'; amt=fmt(e.amount); cls=''; break;
    case 'topup':      title='Пополнение счёта'; amt='+'+fmt(e.amount); cls='pos'; break;
    case 'goal':       title='Пополнение цели'; amt='−'+fmt(e.amount); cls='neg'; break;
    case 'terminal':   title='Оплата в терминале'; amt='−'+fmt(e.amount); cls='neg'; break;
    case 'qr':         title='Оплата по QR'; amt='−'+fmt(e.amount); cls='neg'; break;
    default:           title=e.type||'Операция'; amt=fmt(e.amount||0);
  }
  const date = e.ts ? new Date(e.ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
  return `<div class="hist-row">
    <div class="hist-icon ${cls}">${cls==='pos'?'↓':cls==='neg'?'↑':'⇄'}</div>
    <div class="hist-main"><div>${escapeHtml(title)}</div><div class="muted small">${date}${e.note?' • '+escapeHtml(e.note):''}</div></div>
    <div class="hist-amt ${cls}">${amt}</div>
  </div>`;
}

function viewHistory(){
  const arr = Object.entries(state.user.history||{}).map(([id,v])=>({id,...v})).sort((a,b)=>b.ts-a.ts);
  return `<h2>История</h2>` + (arr.length ? arr.map(historyRow).join('') : '<div class="empty">Операций пока нет</div>');
}

function viewMore(){
  const u = state.user;
  const favs = Object.entries(u.favorites||{});
  const goals = Object.entries(u.goals||{});
  return `
    <h2>Избранное</h2>
    <div class="card">
      <input id="favPhone" class="input" inputmode="tel" placeholder="+7 999 123-45-67"/>

      <button class="btn" id="btnAddFav">Добавить в избранное</button>
      ${favs.length ? `<div class="chips" style="margin-top:12px">${favs.map(([p,n])=>`
        <span class="chip">${escapeHtml(n)} · ${p} <b data-delfav="${p}" style="margin-left:6px;color:var(--err);cursor:pointer">✕</b></span>
      `).join('')}</div>` : ''}
    </div>
    <h2>Цели</h2>
    <div class="card">
      <input id="goalName" class="input" placeholder="Название цели"/>

      <h3>Заявки на карты (${pending.length})</h3>

/* ========== ПРИВЯЗКА ========== */
function bindView(){
  const $ = id => document.getElementById(id);
  if ($('btnLogout')) $('btnLogout').onclick = logout;
  if ($('btnSelf')) $('btnSelf').onclick = async () => {
    try { await opSelfTransfer($('selfFrom').value, $('selfTo').value, $('selfAmount').value); toast('Перевод выполнен','ok'); }
    catch(err){ toast(err.message,'err'); }
  };
  if ($('btnTp')){
    attachPhoneInput($('tpPhone'));
    $('btnTp').onclick = async () => {
      try {
        if (digitsPhone($('tpPhone').value).length < 11) throw new Error('Неверный номер');
        await opTransferByPhone(normalizePhone($('tpPhone').value), $('tpAmount').value, $('tpNote').value.trim());
        toast('Перевод выполнен','ok');
      } catch(err){ toast(err.message,'err'); }
    };
  }
  if ($('btnTopUp')) $('btnTopUp').onclick = async () => {
    try { await opTopUpAccount($('topAmount').value); toast('Счёт пополнен','ok'); }
    catch(err){ toast(err.message,'err'); }
  };
  if ($('btnOrderCard')) $('btnOrderCard').onclick = async () => {
    try { await requestCard(); toast('Заявка отправлена','ok'); }
    catch(err){ toast(err.message,'err'); }
  };
  if ($('btnAddFav')) $('btnAddFav').onclick = async () => {
    try {
      if (digitsPhone($('favPhone').value).length < 11) throw new Error('Неверный номер');
      const p = normalizePhone($('favPhone').value);
      const name = $('favName').value.trim() || p;
      await db.ref('users/'+state.phone+'/favorites/'+p).set(name);
      toast('Добавлено','ok');
    } catch(err){ toast(err.message,'err'); }
  };
  if ($('btnAddGoal')) $('btnAddGoal').onclick = async () => {
    try {
      const name = $('goalName').value.trim();
      const target = parseAmount($('goalTarget').value);
      if (!name) throw new Error('Введите название');
      if (!(target > 0)) throw new Error('Неверная сумма');
      await db.ref('users/'+state.phone+'/goals').push({ name, target, saved:0, createdAt: Date.now() });
      toast('Цель создана','ok');
    } catch(err){ toast(err.message,'err'); }
  };
  document.querySelectorAll('[data-goalcontribute]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.goalcontribute;
      try { await opGoalContribute(id, document.getElementById('goalAmt_'+id).value); toast('Отложено','ok'); }
      catch(err){ toast(err.message,'err'); }
    };
  });
  if ($('favPhone')) attachPhoneInput($('favPhone'));
}

/* ========== ДЕЛЕГАТ ========== */
document.addEventListener('click', async (e) => {
  const qrBtn = e.target.closest('[data-qrscan]');
  if (qrBtn){ openQrScanner(); return; }

  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn){ state.tab = tabBtn.dataset.tab; render(); return; }

  const issueBtn = e.target.closest('[data-issue]');
  if (issueBtn){ await adminIssueCard(issueBtn.dataset.issue); return; }

  const freezeBtn = e.target.closest('[data-freeze]');
  if (freezeBtn){ await adminFreeze(freezeBtn.dataset.freeze, freezeBtn.dataset.state === '1'); return; }

  const favBtn = e.target.closest('[data-fav]');
  if (favBtn){ const inp = document.getElementById('tpPhone'); if (inp) inp.value = formatPhone(favBtn.dataset.fav); return; }

  const delFav = e.target.closest('[data-delfav]');
  if (delFav){ await db.ref('users/'+state.phone+'/favorites/'+delFav.dataset.delfav).remove(); return; }

  const delGoal = e.target.closest('[data-delgoal]');
  if (delGoal){ await db.ref('users/'+state.phone+'/goals/'+delGoal.dataset.delgoal).remove(); return; }
});

/* ========== СТАРТ ========== */
(function boot(){
  const saved = localStorage.getItem('cbank_phone');
  if (saved){ state.phone = saved; subscribeUser(saved); }
  else render();
})();
</script>
