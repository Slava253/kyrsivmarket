<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Курсив Маркет — Клиент</title>
<style>
:root{--bg:#0b1020;--card:#141b33;--card2:#1b2444;--text:#e8ecff;--muted:#8b95c2;
  --accent:#5b7cff;--accent2:#7c5bff;--ok:#25d18a;--err:#ff5b6e;--warn:#ffc107;
  --blue:#5b9cff;--orange:#ff8a00;--border:#26305a;--star:#ffc107}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:radial-gradient(1200px 800px at 20% -10%, #1a2350, #0b1020 60%);
  color:var(--text);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.logo-sm{font-weight:700;letter-spacing:.3px}
.logo-sm span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:rgba(11,16,32,.9);backdrop-filter:blur(10px);z-index:10}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--border);
  color:var(--muted);white-space:nowrap;cursor:pointer;font-size:14px;font-family:inherit;position:relative}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.content{padding:16px;flex:1;padding-bottom:40px}
h2{font-size:20px;margin:0 0 12px}
h3{font-size:15px;color:var(--muted);font-weight:600;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--border);
  background:#0f1530;color:var(--text);font-size:15px;margin-bottom:10px;font-family:inherit;outline:none}
.input:focus{border-color:var(--accent)}
textarea.input{resize:vertical;min-height:70px;font-family:inherit}
.pin{letter-spacing:14px;text-align:center;font-size:24px}
.code-input{letter-spacing:8px;text-align:center;font-size:22px;font-family:monospace}
.btn{width:100%;padding:13px;border-radius:12px;border:none;cursor:pointer;font-size:15px;font-weight:600;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-family:inherit;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn.small{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.btn.ok{background:var(--ok)} .btn.err{background:var(--err)}
.btn:disabled{opacity:.5;cursor:wait}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.panel{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px}
.brand{text-align:center;margin-bottom:20px}
.logo{width:56px;height:56px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-bottom:10px}
.err{color:var(--err);font-size:13px;min-height:18px;margin-bottom:8px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.prod{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;
  display:flex;flex-direction:column;gap:8px;transition:transform .15s;cursor:pointer}
.prod:hover{transform:translateY(-2px);border-color:var(--accent)}
.prod-img{font-size:56px;text-align:center;padding:14px 0;background:#0f1530;border-radius:12px;
  display:flex;align-items:center;justify-content:center;min-height:110px;overflow:hidden}
.prod-img img{max-width:100%;max-height:110px;object-fit:cover;border-radius:10px}
.prod-name{font-size:14px;font-weight:600;line-height:1.3}
.prod-brand{font-size:11px;color:var(--muted);font-weight:500;margin-top:-4px}
.prod-price{font-size:16px;font-weight:700;color:#a5b8ff}
.prod-add{padding:9px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.cart-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border-radius:14px;margin-bottom:8px}
.cart-img{width:52px;height:52px;background:#0f1530;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden}
.cart-img img{width:100%;height:100%;object-fit:cover}
.cart-info{flex:1}
.cart-name{font-size:14px;font-weight:600}
.cart-price{color:var(--muted);font-size:13px;margin-top:2px}
.cart-qty{display:flex;align-items:center;gap:6px}
.qty-btn{width:28px;height:28px;border-radius:8px;background:var(--card2);border:1px solid var(--border);
  color:var(--text);cursor:pointer;font-size:14px;font-family:inherit;display:flex;align-items:center;justify-content:center}
.qty-num{min-width:24px;text-align:center;font-weight:600}
.cart-remove{background:transparent;border:none;color:var(--err);font-size:18px;cursor:pointer;padding:4px 8px}
.total-row{display:flex;justify-content:space-between;align-items:center;padding:16px;margin-top:8px;
  background:var(--card2);border-radius:14px;font-size:16px;font-weight:600}
.order{padding:14px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:10px}
.order-head{display:flex;justify-content:space-between;margin-bottom:8px;align-items:center}
.badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.transit{background:rgba(91,156,255,.15);color:var(--blue)}
.badge.ready{background:rgba(37,209,138,.15);color:var(--ok)}
.badge.issued{background:rgba(139,149,194,.15);color:var(--muted)}
.badge.returned{background:rgba(255,138,0,.15);color:var(--orange)}
.badge.pending{background:rgba(255,193,7,.15);color:var(--warn)}
.badge.approved{background:rgba(37,209,138,.15);color:var(--ok)}
.badge.rejected{background:rgba(255,91,110,.15);color:var(--err)}
.reason-box{padding:10px;border-radius:10px;background:rgba(255,138,0,.08);border:1px solid rgba(255,138,0,.3);
  margin-top:8px;font-size:13px;color:#ffb366}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);z-index:1000;
  display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-body{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px;
  width:100%;max-width:460px;max-height:92vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head b{font-size:17px}
.close-btn{background:transparent;border:1px solid var(--border);color:var(--muted);width:32px;height:32px;
  border-radius:10px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
.pvz-option{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card2);
  border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.15s}
.pvz-option:hover{border-color:var(--accent)}
.pvz-option.selected{border-color:var(--accent);background:rgba(91,124,255,.12)}
.pvz-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center}
.pvz-option.selected .pvz-radio{border-color:var(--accent)}
.pvz-option.selected .pvz-radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--accent)}
.pvz-info{flex:1}
.pvz-name{font-weight:600;font-size:14px}
.pvz-city{color:#a5b8ff;font-size:12px;margin-top:2px;font-weight:600}
.pvz-address{color:var(--muted);font-size:12px;margin-top:2px}
.pvz-schedule{color:var(--muted);font-size:12px;margin-top:2px}
.qr-box{background:#fff;padding:14px;border-radius:16px;display:flex;justify-content:center;margin:14px 0}
.code-box{font-size:34px;font-weight:800;letter-spacing:6px;text-align:center;color:#a5b8ff;
  font-family:monospace;padding:16px;background:#0a1024;border-radius:14px;border:1px dashed var(--border);margin-bottom:14px}
.app-row{padding:14px;background:var(--card2);border-radius:14px;margin-bottom:10px}
.app-head{display:flex;justify-content:space-between;margin-bottom:8px;align-items:center}
.app-row .address{font-size:14px;margin-bottom:4px}
.app-row .schedule{color:var(--muted);font-size:13px;margin-bottom:4px}
.app-row .contact{color:var(--muted);font-size:12px;margin-bottom:10px}
.row-btns{display:flex;gap:8px}
.row-btns .btn{flex:1;padding:9px;font-size:13px}
.creds-box{background:#0a1024;border:1px dashed var(--border);border-radius:12px;padding:12px;margin:10px 0;
  font-family:monospace;font-size:14px}
.creds-box .row{display:flex;justify-content:space-between;padding:4px 0}
.creds-box b{color:#a5b8ff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:12px;
  background:var(--card2);border:1px solid var(--border);font-size:14px;z-index:9999;animation:up .2s;max-width:90vw}
.toast.ok{border-color:var(--ok)} .toast.err{border-color:var(--err)}
@keyframes up{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.nav-badge{background:var(--err);color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;
  margin-left:4px;font-weight:700}
.ord-meta{font-size:11px;color:var(--muted);margin-top:6px;word-break:break-all;font-family:monospace}

/* === отзывы === */
.stars{display:inline-flex;gap:2px;font-size:16px;letter-spacing:1px}
.stars .off{color:#2d3766}
.review{background:var(--card2);border-radius:12px;padding:12px;margin-bottom:10px}
.review-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.review-author{font-weight:600;font-size:14px}
.review-date{font-size:11px;color:var(--muted)}
.review-text{font-size:13px;line-height:1.45;margin:6px 0}
.review-photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.review-photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
.seller-reply{margin-top:8px;padding:8px 10px;border-left:3px solid var(--accent);background:rgba(91,124,255,.08);
  border-radius:6px;font-size:12px}
.seller-reply b{color:#a5b8ff}
.star-input{display:flex;gap:6px;font-size:34px;justify-content:center;margin:10px 0;cursor:pointer}
.star-input span{color:#2d3766;transition:color .15s;user-select:none}
.star-input span.on{color:var(--star)}
.photo-upload{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.photo-upload .ph{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.photo-upload .ph img{width:100%;height:100%;object-fit:cover}
.photo-upload .ph button{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);border:none;color:#fff;
  width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:11px}
.photo-upload label{width:72px;height:72px;border:1px dashed var(--border);border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted);cursor:pointer}
.photo-upload input[type=file]{display:none}

/* === чат поддержки === */
.chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 230px);background:var(--card);
  border:1px solid var(--border);border-radius:16px;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:80%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.4;word-wrap:break-word}
.msg.in{align-self:flex-start;background:var(--card2);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.out{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));border-bottom-right-radius:4px}
.msg-time{font-size:10px;opacity:.6;margin-top:3px;display:block;text-align:right}
.chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border);background:var(--card2)}
.chat-input input{flex:1;margin:0}
.chat-input button{width:auto;padding:0 18px;margin:0}
.profile-name-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.profile-name-row input{margin:0;max-width:220px}
</style>
</head>
<body>
<div class="wrap" id="root"></div>

<div id="pvzSelectModal" class="modal"><div class="modal-body">
  <div class="modal-head"><b>Выберите пункт выдачи</b><button class="close-btn" data-close="pvzSelectModal">✕</button></div>
  <input id="pvzSearch" class="input" placeholder="Введите город…" autocomplete="off"/>
  <div id="pvzListBox"></div>
  <button class="btn" id="btnConfirmOrder" style="margin-top:14px" disabled>Подтвердить заказ</button>
</div></div>

<div id="orderQrModal" class="modal"><div class="modal-body">
  <div class="modal-head"><b>Код получения</b><button class="close-btn" data-close="orderQrModal">✕</button></div>
  <p class="muted small" style="text-align:center;margin:0 0 8px">Покажите QR или назовите 6-значный код сотруднику ПВЗ</p>
  <div class="qr-box"><canvas id="orderQrCanvas"></canvas></div>
  <div class="code-box" id="orderCodeBox">000000</div>
  <div class="muted small" style="text-align:center">ПВЗ: <b id="orderQrPvz">—</b></div>
  <div class="muted small" style="text-align:center;margin-top:6px" id="orderQrStatus"></div>
</div></div>

<div id="applyPvzModal" class="modal"><div class="modal-body">
  <div class="modal-head"><b>Стать пунктом выдачи</b><button class="close-btn" data-close="applyPvzModal">✕</button></div>
  <input id="applyName" class="input" placeholder="Название ПВЗ"/>
  <input id="applyCity" class="input" placeholder="Город (например Москва)"/>
  <input id="applyAddress" class="input" placeholder="Адрес: улица, дом"/>
  <input id="applySchedule" class="input" placeholder="График работы (например Пн-Пт 10:00-20:00)"/>
  <button class="btn" id="btnApplyPvz">Отправить заявку</button>
</div></div>

<div id="boxQrModal" class="modal"><div class="modal-body">
  <div class="modal-head"><b>QR коробки</b><button class="close-btn" data-close="boxQrModal">✕</button></div>
  <div class="qr-box"><canvas id="boxQrCanvas"></canvas></div>
  <div class="code-box" id="boxQrCode" style="font-size:20px;letter-spacing:2px">box000000000</div>
  <p class="muted small" style="text-align:center">Покажите этот QR сотруднику ПВЗ при приёмке</p>
</div></div>

<div id="productModal" class="modal"><div class="modal-body" id="productModalBody"></div></div>
<div id="reviewModal" class="modal"><div class="modal-body" id="reviewModalBody"></div></div>
<div id="photoViewer" class="modal" style="background:rgba(0,0,0,.95)"><div style="max-width:100%;max-height:100vh" id="photoViewerBody"></div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBlZ5ZtyTXgtXxSJAx1jOxwhTrzlHRJmo",
  authDomain: "bk-cashier.firebaseapp.com",
  databaseURL: "https://bk-cashier-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bk-cashier",
  storageBucket: "bk-cashier.firebasestorage.app",
  messagingSenderId: "385000840969",
  appId: "1:385000840969:web:1ec8d09176b6551dc0fdd8"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
db.goOnline();

const ADMIN_PHONE = '+79936050979';

const STATIC_PRODUCT_DEFS = [
  { id:'p1',  name:'AirPods Pro 2',       price:19990, emoji:'🎧', brand:'Apple' },
  { id:'p2',  name:'iPhone 15 128GB',     price:89990, emoji:'📱', brand:'Apple' },
  { id:'p3',  name:'Nike Air Zoom',       price:12990, emoji:'👟', brand:'Nike' },
  { id:'p4',  name:'Куртка зимняя',       price:8990,  emoji:'🧥', brand:'' },
  { id:'p5',  name:'DeLonghi Magnifica',  price:25990, emoji:'☕', brand:'DeLonghi' },
  { id:'p6',  name:'Набор кастрюль',      price:6990,  emoji:'🍳', brand:'' },
  { id:'p7',  name:'Мастер и Маргарита',  price:890,   emoji:'📚', brand:'' },
  { id:'p8',  name:'Рюкзак городской',    price:3990,  emoji:'🎒', brand:'' },
  { id:'p9',  name:'Умные часы',          price:15990, emoji:'⌚', brand:'' },
  { id:'p10', name:'Плед пушистый',       price:1990,  emoji:'🛏️', brand:'' },
  { id:'p11', name:'Пылесос-робот',       price:34990, emoji:'🤖', brand:'' },
  { id:'p12', name:'Кружка керамическая', price:590,   emoji:'🍵', brand:'' },
];
const STATIC_PRODUCTS = STATIC_PRODUCT_DEFS.map(p => ({ ...p, qr: 'prod' + p.id, isStatic: true }));

let ALL_PRODUCTS = STATIC_PRODUCTS.slice();
let PRODUCT_MAP = {};
function rebuildProductMap(){
  PRODUCT_MAP = Object.fromEntries(ALL_PRODUCTS.map(p => [p.id, p]));
}
rebuildProductMap();

const fmt = n => new Intl.NumberFormat('ru-RU').format(Number(n)||0) + ' ₽';
const digits = v => String(v||'').replace(/\D/g,'');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function formatPhone(raw){
  let d = digits(raw);
  if (d.startsWith('9')) d = '7' + d;
  if (d.length > 11) d = d.slice(0,11);
  if (!d) return '';
  let out = '+' + d[0];
  if (d.length > 1) out += ' ' + d.slice(1,4);
  if (d.length > 4) out += ' ' + d.slice(4,7);
  if (d.length > 7) out += '-' + d.slice(7,9);
  if (d.length > 9) out += '-' + d.slice(9,11);
  return out;
}
function normalizePhone(v){ let d = digits(v); if (d.startsWith('9')) d='7'+d; return '+'+d; }
function attachPhoneInput(inp){
  inp.addEventListener('input', () => {
    const f = formatPhone(inp.value);
    if (f !== inp.value){ inp.value = f; inp.setSelectionRange(f.length, f.length); }
  });
}
function toast(msg, type){
  const t = document.createElement('div');
  t.className = 'toast ' + (type||'');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }

function statusLabel(s){
  if (s === 'pending' || s === 'transit') return 'В пути';
  if (s === 'ready') return 'Готов к выдаче';
  if (s === 'issued') return 'Выдан';
  if (s === 'returned') return 'Возвращён';
  return s || '—';
}
function statusClass(s){
  if (s === 'pending' || s === 'transit') return 'transit';
  if (s === 'ready') return 'ready';
  if (s === 'issued') return 'issued';
  if (s === 'returned') return 'returned';
  return 'transit';
}
function getPvzCity(pvz){
  if (!pvz) return '';
  if (pvz.city) return pvz.city;
  const parts = String(pvz.address||'').split(',');
  return parts[0] ? parts[0].trim() : '';
}

function genPassword(len=8){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
  let p = '';
  for (let i = 0; i < len; i++) p += chars[Math.floor(Math.random()*chars.length)];
  return p;
}
async function generateUniqueLogin(){
  for (let i = 0; i < 20; i++){
    const l = 'pvz' + Math.random().toString(36).slice(2, 8).padEnd(6, '0').slice(0, 6);
    const snap = await db.ref('pvzLogins/'+l).once('value');
    if (!snap.exists()) return l;
  }
  throw new Error('Не удалось сгенерировать логин');
}
async function generateCode6(){
  for (let i = 0; i < 12; i++){
    const c = String(Math.floor(Math.random()*1000000)).padStart(6,'0');
    const snap = await db.ref('codeIndex/'+c).once('value');
    if (!snap.exists()) return c;
  }
  throw new Error('Не удалось сгенерировать код');
}
async function generateBoxCode(){
  for (let i = 0; i < 12; i++){
    const digits9 = String(Math.floor(Math.random()*1000000000)).padStart(9,'0');
    const code = 'box' + digits9;
    const snap = await db.ref('boxIndex/'+code).once('value');
    if (!snap.exists()) return code;
  }

}

};
const loginState = { step:'phone', phone:null, mode:null, pinFirst:null, error:'' };
let unsubUser=null, unsubPvz=null, unsubApps=null, unsubOrders=null;
let unsubProducts=null, unsubSupport=null, unsubSupportAccs=null, unsubReviews=null;
let renderPending=false;
function renderSoon(){

function renderLogin(){
  const l = loginState;
  const root = document.getElementById('root');
  let body = '';
  if (l.step === 'phone'){
    body = `
      <div class="brand"><div class="logo">К</div><h1>Курсив Маркет</h1></div>
      <h2>Вход или регистрация</h2>

      <div class="err" id="err"></div>
      <button class="btn" id="btnNext">Продолжить</button>
    `;
  } else {
    const isCreate = l.mode === 'create';
    const confirm = isCreate && l.pinFirst !== null;
    const title = isCreate ? (confirm ? 'Повторите PIN-код' : 'Придумайте PIN-код (4 цифры)') : 'Введите PIN-код';
    body = `
      <div class="brand"><div class="logo">К</div><h1>Курсив Маркет</h1></div>
      <h2>${title}</h2>
      <p class="muted">${esc(l.phone||'')}</p>
      <input id="pinInput" class="input pin" inputmode="numeric" maxlength="4" type="password" placeholder="••••" autocomplete="off"/>
      <div class="err" id="err">${esc(l.error||'')}</div>
      <button class="btn" id="btnPin">${isCreate ? (confirm?'Создать':'Далее') : 'Войти'}</button>
      <button class="btn ghost" id="btnBack" style="margin-top:8px">Назад</button>
    `;
  }
  root.innerHTML = `<div class="login-wrap"><div class="panel">${body}</div></div>`;

  if (l.step === 'phone'){
    const inp = document.getElementById('phoneInput');
    attachPhoneInput(inp); inp.focus();
    document.getElementById('btnNext').onclick = async () => {
      if (digits(inp.value).length < 11){ document.getElementById('err').textContent = 'Введите номер полностью'; return; }
      const phone = normalizePhone(inp.value);
      document.getElementById('btnNext').textContent = 'Проверяем…';
      const snap = await db.ref('users/'+phone).once('value');
      loginState.phone = phone; loginState.error = '';
      if (snap.exists()){ loginState.mode = 'login'; }
      else { loginState.mode = 'create'; loginState.pinFirst = null; }
      loginState.step = 'pin'; render();
    };
    inp.addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('btnNext').click(); });
  } else {
    const pin = document.getElementById('pinInput');
    pin.focus();
    document.getElementById('btnPin').onclick = async () => {
      const v = pin.value.trim();
      if (!/^\d{4}$/.test(v)){ loginState.error = 'PIN должен быть из 4 цифр'; render(); return; }
      if (loginState.mode === 'login'){
        const snap = await db.ref('users/'+loginState.phone+'/pin').once('value');
        if (snap.val() === v) doLogin(loginState.phone);
        else { loginState.error = 'Неверный PIN'; render(); }
      } else {
        if (loginState.pinFirst === null){ loginState.pinFirst = v; loginState.error = ''; render(); }
        else {
          if (loginState.pinFirst !== v){ loginState.error = 'PIN не совпадает'; loginState.pinFirst = null; render(); return; }
          await db.ref('users/'+loginState.phone).set({ pin: v, createdAt: Date.now() });
          doLogin(loginState.phone);
        }
      }
    };
    pin.addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('btnPin').click(); });
    document.getElementById('btnBack').onclick = () => { loginState.step='phone'; loginState.error=''; render(); };
  }
}

function safeUnsub(fn){ if (fn){ try{ fn(); }catch(e){ console.warn(e); } } }
function subscribeUser(phone){
  safeUnsub(unsubUser); unsubUser=null;
  safeUnsub(unsubPvz); unsubPvz=null;
  safeUnsub(unsubApps); unsubApps=null;
  safeUnsub(unsubOrders); unsubOrders=null;
  safeUnsub(unsubProducts); unsubProducts=null;
  safeUnsub(unsubSupport); unsubSupport=null;
  safeUnsub(unsubSupportAccs); unsubSupportAccs=null;
  safeUnsub(unsubReviews); unsubReviews=null;

  const userRef = db.ref('users/'+phone);
  const userCb = snap => {
    if (!snap.exists()){ logout(); return; }
    state.user = snap.val();
    renderSoon();
  };
  userRef.on('value', userCb);
  unsubUser = () => userRef.off('value', userCb);

  const pvzRef = db.ref('pvz');
  const pvzCb = snap => { state.pvzList = snap.val() || {}; renderSoon(); };
  pvzRef.on('value', pvzCb);
  unsubPvz = () => pvzRef.off('value', pvzCb);

  const prodRef = db.ref('sellerProducts');
  const prodCb = snap => {
    state.sellerProducts = snap.val() || {};
    const sellerList = Object.entries(state.sellerProducts)
      .filter(([,p]) => p && p.active !== false)
      .map(([id,p]) => ({
        id,
        name: p.name || 'Без названия',
        brand: p.brand || '',
        price: Number(p.price)||0,
        photo: p.photo || '',
        description: p.description || '',
        qr: p.qr || ('prod' + id),
        sellerPhone: p.sellerPhone,
        isStatic: false,
      }));
    ALL_PRODUCTS = STATIC_PRODUCTS.slice().concat(sellerList);
    rebuildProductMap();
    renderSoon();
  };
  prodRef.on('value', prodCb);
  unsubProducts = () => prodRef.off('value', prodCb);

  const suppRef = db.ref('supportMessages/'+phone);
  const suppCb = snap => {
    state.supportMsgs = snap.val() || {};
    let unread = 0;
    for (const m of Object.values(state.supportMsgs)) if (m.from === 'support' && !m.readAt) unread++;
    state.supportUnread = unread;
    renderSoon();
  };
  suppRef.on('value', suppCb);
  unsubSupport = () => suppRef.off('value', suppCb);

  if (phone === ADMIN_PHONE){
    const appsRef = db.ref('pvzApplications');
    const appsCb = snap => {
      state.applications = snap.val() || {};
      if (state.tab === 'admin') renderSoon();
    };
    appsRef.on('value', appsCb);
    unsubApps = () => appsRef.off('value', appsCb);

    const ordersRef = db.ref('orderIndex');
    const ordersCb = snap => {
      state.orderIndex = snap.val() || {};
      if (state.tab === 'admin') renderSoon();
    };
    ordersRef.on('value', ordersCb);
    unsubOrders = () => ordersRef.off('value', ordersCb);

    const supAccRef = db.ref('supportAccounts');
    const supAccCb = snap => {
      state.supportAccounts = snap.val() || {};
      if (state.tab === 'admin') renderSoon();
    };
    supAccRef.on('value', supAccCb);
    unsubSupportAccs = () => supAccRef.off('value', supAccCb);
  }
}
function logout(){
  safeUnsub(unsubUser); safeUnsub(unsubPvz); safeUnsub(unsubApps); safeUnsub(unsubOrders);
  safeUnsub(unsubProducts); safeUnsub(unsubSupport); safeUnsub(unsubSupportAccs); safeUnsub(unsubReviews);
  unsubUser=unsubPvz=unsubApps=unsubOrders=unsubProducts=unsubSupport=unsubSupportAccs=unsubReviews=null;

  localStorage.removeItem('mkt_phone');
  state.phone=null; state.user=null; state.tab='shop';
  state.pvzList={}; state.applications={}; state.orderIndex={};
  state.selectedPvzId=null; state.pvzSearch='';
  state.sellerProducts={}; state.reviews={}; state.supportMsgs={}; state.supportAccounts={};
  Object.assign(loginState, { step:'phone', phone:null, mode:null, pinFirst:null, error:'' });
  render();
}

async function createOrder(pvzId){

  const orderRef = db.ref('users/'+state.phone+'/orders').push();
  const orderId = orderRef.key;

  const units = [];
  for (const it of items){
    const baseQr = (PRODUCT_MAP[it.id] && PRODUCT_MAP[it.id].qr) || ('prod' + it.id);
    for (let i = 0; i < it.qty; i++){
      units.push({ qr: baseQr, productId: it.id, name: it.name });
    }
  }

    const o = { id: i.id, name: i.name, price: i.price, qty: i.qty };
    if (i.emoji) o.emoji = i.emoji;
    if (i.brand) o.brand = i.brand;

    return o;
  });

  const order = {
    items: cleanItems,
    total, pvzId, pvzAddress: pvz.address, pvzName: pvz.name,
    code6, boxCode, cell, status: 'transit', ts: Date.now(),
    units,
  };
  const updates = {};

  updates['users/'+state.phone+'/cart'] = null;
  updates['orderIndex/'+orderId] = {
    phone: state.phone, code6, boxCode, status: 'transit',
    pvzId, pvzName: pvz.name, pvzCity: getPvzCity(pvz),
    cell, total, ts: Date.now(),

  updates['codeIndex/'+code6] = { orderId, phone: state.phone, pvzId };
  updates['boxIndex/'+boxCode] = { orderId, phone: state.phone, pvzId };
  await db.ref().update(updates);
  return { orderId, code6, boxCode };
}

async function compressImage(file, maxW, quality){
  maxW = maxW || 800; quality = quality || 0.7;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxW){ h = h * maxW / w; w = maxW; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        try { resolve(canvas.toDataURL('image/jpeg', quality)); }
        catch(e){ reject(e); }
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

          <button class="qty-btn" data-qty="${i.id}" data-delta="-1">−</button>

          <button class="qty-btn" data-qty="${i.id}" data-delta="1">+</button>
        </div>
        <button class="cart-remove" data-removecart="${i.id}">✕</button>
      </div>`).join('')}
    <div class="total-row"><span>Итого</span><span>${fmt(total)}</span></div>
    <button class="btn" id="btnCheckout" style="margin-top:14px">Оформить заказ</button>`;
}

function viewOrders(){
  const list = Object.entries(state.user.orders||{}).map(([id,v])=>({id,...v})).sort((a,b)=>b.ts-a.ts);
  if (!list.length) return `<h2>Мои заказы</h2><div class="empty">Заказов пока нет</div>`;
  return `<h2>Мои заказы</h2>` + list.map(o=>{
    const st = statusClass(o.status);
    const isReturned = o.status === 'returned';
    const isIssued = o.status === 'issued';
    return `<div class="order">
      <div class="order-head">
        <span class="muted small">${new Date(o.ts).toLocaleString('ru-RU')}</span>
        <span class="badge ${st}">${statusLabel(o.status)}</span>
      </div>
      <div style="font-size:14px;margin-bottom:6px">${o.items.map(i=>`${i.emoji||''} ${esc(i.name)} ×${i.qty}`).join('<br>')}</div>
      <div class="muted small" style="margin-bottom:10px">ПВЗ: ${esc(o.pvzName||'')} · ${esc(o.pvzAddress||'')}</div>
      ${isReturned && o.returnReason ? `<div class="reason-box">↩ Возврат: ${esc(o.returnReason)}</div>` : ''}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
        <b>${fmt(o.total)}</b>
        ${!isIssued && !isReturned
          ? `<button class="btn small" data-showqr="${o.id}">QR и код</button>`
          : `<span class="muted small">${isIssued ? 'Выдан ' + (o.issuedAt ? new Date(o.issuedAt).toLocaleDateString('ru-RU') : '') : 'Возвращён ' + (o.returnedAt ? new Date(o.returnedAt).toLocaleDateString('ru-RU') : '')}</span>`}
      </div>
      ${isIssued ? `<div style="margin-top:10px">
        ${o.items.map(i=>`<button class="btn small ghost" data-reviewprod="${i.id}" style="margin:3px 4px 0 0">★ Отзыв: ${esc(i.name)}</button>`).join('')}
      </div>` : ''}
    </div>`;
  }).join('');
}

  let pvzBlock = '';
  if (pa && pa.status === 'pending'){
    pvzBlock = `<div class="card">
      <h3>Заявка на ПВЗ</h3>

      </div>

      <p class="muted small" style="margin:0">Войдите в приложение ПВЗ по этим данным (файл <code>pvz.html</code>).</p>

      </div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span class="muted">Телефон</span><b>${esc(state.phone)}</b></div>
      <div style="display:flex;justify-content:space-between"><span class="muted">Роль</span>
        <b>${isAdmin ? 'Администратор' : (pa && pa.status === 'approved' ? 'Клиент + ПВЗ' : 'Клиент')}</b></div>
    </div>
    ${pvzBlock}
    ${canApply && !isAdmin ? `<div class="card">
      <h3>Стать пунктом выдачи</h3>

}
